<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<!-- Löftet om en app utan utgående anrop, hävdat av webbläsaren i stället för
     bara av bygg.py. connect-src 'none' stänger fetch, XMLHttpRequest,
     WebSocket, EventSource och sendBeacon — alltså varje väg som kan skicka
     iväg ett skytteregister utan att användaren ser det. Appen gör inga
     sådana anrop i dag; direktivet finns för att den inte ska kunna börja
     göra det obemärkt, vare sig genom ett misstag eller genom inklistrad kod.

     form-action 'none' är samma sak för formulär: fönstret för att lägga till
     en skytt har en submit-hanterare som anropar preventDefault(), men om den
     någon gång slutar göra det ska webbläsaren stoppa POST:en i stället för
     att skicka namn och Fmid till en okänd adress.

     Medvetet INTE default-src 'none': appen ska också fungera öppnad som lös
     fil (file://), där 'self' inte matchar likadant, och en för snäv policy
     hade tagit ikonen och manifestet med sig. Direktiven här är valda för att
     enbart stänga vägar ut. -->
<meta http-equiv="Content-Security-Policy" content="connect-src 'none'; form-action 'none'; object-src 'none'; base-uri 'none'; frame-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FM kompetensprov</title>
<!-- Versionen skrivs bara i package.json; bygg.py byter innehållet här mot
     numret därifrån, precis som cachenamnet i sw.js. Lämna "utveckling"
     stående i src/ — den som serverar src/ direkt kör inte en utgåva. -->
<meta name="version" content="utveckling">
<meta name="description" content="Instruktörsverktyg för Försvarsmaktens kompetensprov, pistol och automatkarbin.">
<meta name="theme-color" content="#0b0d0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kompetensprov">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="ikon-180.png">
<link rel="icon" href="ikon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <button class="hem" id="hem" hidden aria-label="Till startsidan" title="Till startsidan">
    <!-- Ritad ikon i stället för tecknet ⌂, som är tunt och tecknas olika på
         olika telefoner. Fylld form ger kontrast nog att träffas i mörker. -->
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M12 3 2.5 11.2h2.6V21h5.1v-5.9h3.6V21h5.1v-9.8h2.6z"/>
    </svg>
  </button>
  <!-- Stegning mellan skyttarna, en pil på var sida om namnet. Bara
       tidfönstret visar dem: går något snett på linjen ska man kunna gå
       tillbaka en tavla utan att först leta sig ut till vallistan. Samma
       ritade form som huset — piltecken tecknas olika på olika telefoner. -->
  <button class="stega" id="stegabak" hidden data-stega="-1"
          aria-label="Föregående skytt" title="Föregående skytt">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M15.4 4.6 8 12l7.4 7.4 2.1-2.1L12.2 12l5.3-5.3z"/>
    </svg>
  </button>
  <h1 id="rubrik">
    <span id="rubriktext">FM kompetensprov</span>
    <span class="under" id="underrubrik">Pistol och automatkarbin</span>
  </h1>
  <button class="stega" id="stegafram" hidden data-stega="1"
          aria-label="Nästa skytt" title="Nästa skytt">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M8.6 4.6 16 12l-7.4 7.4-2.1-2.1L11.8 12 6.5 6.7z"/>
    </svg>
  </button>
  <!-- Utgåvan, längst ut till höger i varje vy. Fylls av app.js ur metataggen
       ovan. Den ska gå att läsa av utan att leta i inställningarna — frågan
       "vilken version kör du?" ställs oftast när något redan krånglar. -->
  <span class="utgava" id="utgava"></span>
</header>
<main id="app"></main>
<!-- Texterna bor som .md-filer i src/ och bakas in hit av bygg.py, som läser
     data-fil. Att hämta dem vid körning hade brutit löftet om en app utan
     externa anrop. -->
<script type="text/markdown" id="dok-anvandning" data-fil="anvandning.md"></script>
<script type="text/markdown" id="dok-hjalp" data-fil="hjalp.md"></script>
<div class="bottenrad" id="bottenrad"></div>
<script type="module" src="app.js"></script>
</body>
</html>
