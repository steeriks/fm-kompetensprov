<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<!-- Löftet om en app utan utgående anrop, hävdat av webbläsaren i stället för
     bara av bygg.py. connect-src 'none' stänger fetch, XMLHttpRequest,
     WebSocket, EventSource och sendBeacon — alltså varje väg som kan skicka
     iväg ett skytteregister utan att användaren ser det. Appen gör inga
     sådana anrop i dag; direktivet finns för att den inte ska kunna börja
     göra det obemärkt, vare sig genom ett misstag eller genom inklistrad kod.

     form-action 'none' är samma sak för formulär: fönstret för att lägga till
     en skytt har en submit-hanterare som anropar preventDefault(), men om den
     någon gång slutar göra det ska webbläsaren stoppa POST:en i stället för
     att skicka namn och Fmid till en okänd adress.

     Medvetet INTE default-src 'none': appen ska också fungera öppnad som lös
     fil (file://), där 'self' inte matchar likadant, och en för snäv policy
     hade tagit ikonen och manifestet med sig. Direktiven här är valda för att
     enbart stänga vägar ut. -->
<meta http-equiv="Content-Security-Policy" content="connect-src 'none'; form-action 'none'; object-src 'none'; base-uri 'none'; frame-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FM kompetensprov</title>
<!-- Versionen skrivs bara i package.json; bygg.py byter innehållet här mot
     numret därifrån, precis som cachenamnet i sw.js. Lämna "utveckling"
     stående i src/ — den som serverar src/ direkt kör inte en utgåva. -->
<meta name="version" content="1.1.4">
<meta name="description" content="Instruktörsverktyg för Försvarsmaktens kompetensprov, pistol och automatkarbin.">

/* FM kompetensprov — mörkt högkontrasttema, byggt för en hand i mörker.
   Allt som ska nås under skjutning ligger i nederkant, inom tummens räckvidd.
   Minsta träffyta är 48 px; knappar som trycks ofta är större än så. */

:root {
  color-scheme: dark;
  --bg: #0b0d0c;
  --kort: #161916;
  --kort-ljus: #1e221e;
  --ink: #f2f4ec;
  --dampad: #a4ab9c;
  --linje: #363c34;
  --accent: #8fbf7f;
  --accent-ink: #0b0d0c;
  --godkand: #6fbf63;
  --underkand: #e07a6d;
  --varning: #e3c33c;
  --font: ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", sans-serif;
  --radie: 12px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

/* `hidden` måste bita hårdare än våra egna display-regler. Webbläsarens
   inbyggda [hidden] { display: none } ligger i UA-lagret och förlorar mot
   varje display i det här arket — hemknappen och stegningspilarna sätter
   display: flex och hade annars stått kvar synliga i vyer som gömt dem. */
[hidden] { display: none !important; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 17px/1.45 var(--font);
  padding-bottom: env(safe-area-inset-bottom);
  overscroll-behavior-y: contain;
}

header {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: 0.6rem;
  padding: calc(0.6rem + env(safe-area-inset-top)) 0.9rem 0.6rem;
  background: #101310; border-bottom: 1px solid var(--linje);
}
header h1 {
  font-size: 1.15rem; margin: 0; font-weight: 700; letter-spacing: 0.01em;
  min-width: 0; overflow-wrap: anywhere;      /* långa namn ska brytas, inte tränga ut */
}
header .under { display: block; font-size: 0.8rem; color: var(--dampad); font-weight: 400; }
/* Tavelnumret i rubriken får samma färg som i listan, så att blicken hittar
   det utan att läsa. */
header h1 .nr { color: var(--accent); }
/* Hemknappen: bara huset, ingen ram. Träffytan är kvar på 44 px även om
   själva ikonen är mindre — det är fingret som ska ha plats, inte ramen. */
.hem {
  flex: 0 0 auto; width: 44px; height: 44px; padding: 0;
  display: flex; align-items: center; justify-content: center;
  background: none; border: 0; color: var(--ink);
  cursor: pointer; touch-action: manipulation;
}
.hem svg { width: 27px; height: 27px; fill: currentColor; display: block; }
.hem:active { transform: scale(0.9); color: var(--accent); }

/* Stegningspilarna flankerar namnet i tidfönstret. Samma träffyta som huset:
   44 px, oavsett hur liten pilen ritas. Den som pekar förbi linjens ände
   slocknar — en död knapp som syns är bättre än ett meddelande att läsa. */
.stega {
  flex: 0 0 auto; width: 44px; height: 44px; padding: 0;
  display: flex; align-items: center; justify-content: center;
  background: none; border: 0; color: var(--accent);
  cursor: pointer; touch-action: manipulation;
}
.stega svg { width: 26px; height: 26px; fill: currentColor; display: block; }
.stega:active { transform: scale(0.9); }
.stega:disabled { color: var(--linje); cursor: default; }
.stega:disabled:active { transform: none; }

/* Utgåvan i huvudets högerkant. margin-left: auto skjuter den ut till kanten
   utan att röra ordningen på det som står före — huset, pilarna och rubriken
   packas som förut. Dämpad och liten: den ska gå att läsa av när någon
   frågar, inte konkurrera med skyttens namn. */
.utgava {
  flex: 0 0 auto; align-self: flex-start;
  font-size: 0.7rem; color: var(--dampad); font-variant-numeric: tabular-nums;
  margin-left: auto;
}

/* Nedre marginalen följer bottenradens verkliga höjd (sätts av mätBottenrad).
   Reservvärdet gäller innan första mätningen och i lägen utan JS-mätning. */
main {
  padding: 0.9rem 0.9rem calc(var(--bottenhojd, 7.5rem) + 1rem);
  max-width: 46rem; margin: 0 auto;
}
h2 { font-size: 1rem; margin: 1.2rem 0 0.5rem; color: var(--dampad); font-weight: 600; }
p.dampad, .dampad { color: var(--dampad); }
.liten { font-size: 0.85rem; }

/* ------------------------------------------------------------- knappar */

button { font: inherit; }
.knapp {
  display: flex; align-items: center; justify-content: center; gap: 0.4rem;
  width: 100%; min-height: 56px; padding: 0.7rem 1rem;
  background: var(--kort); color: var(--ink);
  border: 1px solid var(--linje); border-radius: var(--radie);
  cursor: pointer; touch-action: manipulation;
}
.knapp.primar { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.knapp.fara { color: var(--underkand); border-color: var(--underkand); background: none; }
.knapp.liten { min-height: 44px; width: auto; padding: 0.4rem 0.9rem; font-size: 0.9rem; }
/* Tre knappar på en rad: mindre text och tightare kanter i stället för tre
   egna rader, som hade ätit en fjärdedel av skärmen. */
.knapp.smal { padding: 0.35rem 0.45rem; font-size: 0.78rem; line-height: 1.15; }
.knapp:active { transform: scale(0.98); }
/* Klassen bärs också av en <a> — länken till koden under Appinställningar.
   Utan det här arvet hade den fått webbläsarens blå understrukna länkstil
   mitt i en rad med knappar. */
a.knapp { text-decoration: none; }
.knapprad { display: flex; gap: 0.5rem; margin: 0.6rem 0; }
.knapprad .knapp { width: auto; flex: 1; }

/* --------------------------------------------------------------- fält */

label.falt { display: block; margin-bottom: 0.8rem; font-size: 0.9rem; color: var(--dampad); }
label.falt input, label.falt select, label.falt textarea {
  display: block; width: 100%; margin-top: 0.25rem;
  font: 17px/1.4 var(--font); color: var(--ink);
  background: var(--kort); border: 1px solid var(--linje);
  border-radius: var(--radie); padding: 0.7rem 0.8rem; min-height: 50px;
}

/* Importrutan. Ingen radbrytning i mjukvara: en lista där en rad rinner över
   till nästa ser ut som två skyttar, och det är precis den förväxling
   granskningen under fältet finns för att undvika. */
label.falt textarea { resize: vertical; white-space: pre; overflow-wrap: normal; overflow-x: auto; }

/* Grått "valfritt" i de fält som får lämnas tomma — dämpat, så att ett ifyllt
   värde och en tom ruta går att skilja åt med en blick. */
label.falt input::placeholder { color: var(--dampad); opacity: 1; }

/* Namnet är det enda som måste fyllas i, och säger ifrån på plats. */
label.falt input.saknas { border-color: var(--underkand); }

/* Rutan för en ny skytt ligger ovanpå den vy man står i, så att den som
   bockar i deltagare inte tappar sin halvfyllda omgång. Överkanten är ledig:
   telefonens tangentbord tar underkanten så fort namnfältet får fokus. */
.modal {
  position: fixed; inset: 0; z-index: 60;
  display: flex; align-items: flex-start; justify-content: center;
  padding: 2rem 1rem calc(1rem + env(safe-area-inset-bottom));
  background: rgba(0, 0, 0, 0.66); overflow-y: auto;
}
.modalkort {
  width: 100%; max-width: 26rem; margin: 0;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
}
.modalkort h2 { margin-top: 0.2rem; }
.modalkort .knapprad { margin-bottom: 0; }

/* --------------------------------------------------------------- kort */

.kort {
  background: var(--kort); border: 1px solid var(--linje);
  border-radius: var(--radie); padding: 0.8rem; margin-bottom: 0.6rem;
}
.tom {
  text-align: center; color: var(--dampad); padding: 2rem 1rem;
}

/* ------------------------------------------------------------ vallista */

.skyttrad {
  display: grid; grid-template-columns: 1fr auto auto;
  align-items: center; gap: 0.2rem 0.6rem;
  background: var(--kort); border: 1px solid var(--linje);
  border-radius: var(--radie); margin-bottom: 0.5rem;
  padding: 0.6rem 0.7rem; min-height: 64px; width: 100%;
  color: inherit; text-align: left; cursor: pointer;
  /* Ett långt tryck ska lyfta raden för att flytta skytten — inte markera
     namnet och visa iOS kopieringsmeny mitt i draget. */
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
.skyttrad.klar { border-color: #2f4a2c; }
.skyttrad .namn { font-weight: 600; }
.skyttrad .forband { grid-column: 1; font-size: 0.8rem; color: var(--dampad); }
.skyttrad .varden {
  grid-column: 2; grid-row: 1 / span 2; text-align: right;
  font-variant-numeric: tabular-nums; font-size: 0.9rem; color: var(--dampad);
}
.skyttrad .varden b { color: var(--ink); font-size: 1.05rem; }
.skyttrad .chip { grid-column: 3; grid-row: 1 / span 2; }
.chip {
  display: inline-block; padding: 0.2rem 0.6rem; border-radius: 999px;
  font-size: 0.78rem; font-weight: 700; letter-spacing: 0.02em;
  border: 1px solid var(--linje); color: var(--dampad);
}
.chip.g { background: rgba(111, 191, 99, 0.16); color: var(--godkand); border-color: var(--godkand); }
.chip.u { background: rgba(224, 122, 109, 0.16); color: var(--underkand); border-color: var(--underkand); }
.chip.v { background: rgba(227, 195, 60, 0.14); color: var(--varning); border-color: var(--varning); }

.historik { margin: -0.2rem 0 0.6rem; padding: 0 0.7rem; }
.historik .forsokrad {
  display: flex; justify-content: space-between; gap: 0.6rem;
  padding: 0.45rem 0; border-bottom: 1px solid var(--linje);
  font-size: 0.88rem; color: var(--dampad); font-variant-numeric: tabular-nums;
}
.historik .forsokrad:last-child { border-bottom: 0; }

/* --------------------------------------------------------- lägesväljare */

.bottenrad {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  padding: 0.6rem 0.9rem calc(0.6rem + env(safe-area-inset-bottom));
  background: linear-gradient(to top, #101310 72%, rgba(16, 19, 16, 0));
  display: flex; flex-direction: column; gap: 0.5rem;
  max-width: 46rem; margin: 0 auto;
}
.lagesvaljare {
  display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem;
  background: var(--kort); border: 1px solid var(--linje);
  border-radius: var(--radie); padding: 0.25rem;
}
.lagesvaljare button {
  min-height: 48px; border: 0; border-radius: 9px; cursor: pointer;
  background: none; color: var(--dampad); font-weight: 700; letter-spacing: 0.03em;
}
.lagesvaljare button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
/* Anvisningarna har tre prov att välja mellan — pistol och automatkarbin på
   50 respektive 30 m. Knapparna ryms bredvid varandra så länge texten hålls
   kort; blir det fler prov får raden brytas i stället. */
.lagesvaljare.tre { grid-template-columns: repeat(3, 1fr); }
.lagesvaljare.tre button { font-size: 0.95rem; }

/* -------------------------------------------------------- sifferknappsats */

.tidvisning {
  text-align: center; font-variant-numeric: tabular-nums;
  font-size: 3.4rem; font-weight: 700; letter-spacing: 0.02em;
  padding: 1rem 0 0.4rem; min-height: 5rem;
}
.tidvisning .enhet { font-size: 1.2rem; color: var(--dampad); font-weight: 400; }
.tidvisning.tom { color: var(--linje); }
.knappsats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
.knappsats button {
  min-height: 68px; font-size: 1.6rem; font-weight: 600;
  background: var(--kort-ljus); color: var(--ink);
  border: 1px solid var(--linje); border-radius: var(--radie); cursor: pointer;
  touch-action: manipulation;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
.knappsats button:active { background: var(--accent); color: var(--accent-ink); }

/* ------------------------------------------------------------ zonknappar */

.zongrupp { margin-bottom: 0.9rem; }
.zongrupp h3 {
  display: flex; justify-content: space-between; align-items: baseline;
  font-size: 0.9rem; margin: 0 0 0.4rem; color: var(--dampad); font-weight: 600;
}
.zongrupp h3 .raknare { font-variant-numeric: tabular-nums; }
.zongrupp h3 .raknare.klar { color: var(--godkand); }
/* Överskottet: röda siffror inom parentes, för att skilja det inknappade
   antalet från det som räknas. Röd som i underkänt — inte för att något är
   fel, utan för att det är den färg som fångar ögat i den här appen. */
.zongrupp h3 .raknare .over { color: var(--underkand); font-weight: 700; }
.zoner { display: grid; grid-template-columns: repeat(auto-fit, minmax(4.6rem, 1fr)); gap: 0.5rem; }
.zonknapp {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 0.15rem; min-height: 82px; padding: 0.5rem 0.2rem;
  background: var(--kort-ljus); color: var(--ink);
  border: 1px solid var(--linje); border-radius: var(--radie);
  cursor: pointer; touch-action: manipulation;
  /* Zonknappen hålls in för att nollas — samma spärr som på skytteraderna. */
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
.zonknapp .bokstav { font-size: 1.5rem; font-weight: 700; line-height: 1; }
.zonknapp .antal { font-size: 1.25rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.zonknapp .poang { font-size: 0.75rem; color: var(--dampad); line-height: 1; }
.zonknapp.har { border-color: var(--accent); background: rgba(143, 191, 127, 0.18); }
.zonknapp.har .antal { color: var(--accent); }
.zonknapp:active { transform: scale(0.96); }

/* Rimlighetspåpekandet när det knappats in orimligt många träffar i en
   målyta. Gul och inte röd: ingenting är fel, det är en uppmaning att titta
   efter ett tryck för mycket. */
.gruppvarning {
  margin: 0 0 0.4rem; font-size: 0.8rem; color: var(--varning);
}

.summering {
  display: flex; justify-content: space-between; align-items: baseline;
  gap: 0.6rem; padding: 0.7rem 0.8rem; margin: 0.4rem 0 0.6rem;
  background: var(--kort); border: 1px solid var(--linje); border-radius: var(--radie);
  font-variant-numeric: tabular-nums;
}
.summering .pk { font-size: 1.6rem; font-weight: 700; }
.summering .pk.g { color: var(--godkand); }
.summering .pk.u { color: var(--underkand); }
.summering .utfall { font-weight: 700; letter-spacing: 0.02em; }
.summering .utfall.g { color: var(--godkand); }
.summering .utfall.u { color: var(--underkand); }
.brister { color: var(--underkand); font-size: 0.85rem; margin: 0.2rem 0 0.6rem; }

/* ----------------------------------------------------------- anvisningar */

.anvisningsrubrik { margin: 0 0 0.6rem; font-size: 0.95rem; }
.fakta {
  display: grid; grid-template-columns: 7rem 1fr; gap: 0.3rem 0.8rem; margin: 0;
  font-size: 0.9rem;
}
.fakta dt { color: var(--dampad); }
.fakta dd { margin: 0; }
.steg { margin: 0 0 1rem; padding-left: 1.4rem; }
.steg li { margin-bottom: 0.6rem; padding-left: 0.2rem; }
.steg li::marker { color: var(--accent); font-weight: 700; }

/* ---------------------------------------------------------------- dialog */

/* Beskedet om att en ny version ligger klar, direkt ovanför bottenraden. Det
   ligger UTANFÖR #bottenrad, som varje vy skriver om — som barn hade det
   försvunnit vid nästa omritning. Accentfärgat och inte gult: det är ett
   erbjudande, inte en varning, och ingenting är fel förrän man trycker. */
.uppdatering {
  position: fixed; left: 0; right: 0; z-index: 25;
  bottom: var(--bottenradhojd, 7.5rem);
  display: flex; align-items: center; justify-content: center;
  min-height: 44px; padding: 0.5rem 0.9rem;
  max-width: 46rem; margin: 0 auto;
  background: var(--accent); color: var(--accent-ink);
  border: 0; font: inherit; font-size: 0.9rem; font-weight: 700;
  cursor: pointer; touch-action: manipulation;
}
.uppdatering:active { transform: scale(0.99); }

.flash {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(9rem + env(safe-area-inset-bottom)); z-index: 40;
  background: var(--kort-ljus); border: 1px solid var(--accent);
  color: var(--ink); padding: 0.7rem 1rem; border-radius: var(--radie);
  max-width: 90%; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.6);
}
.varningsruta {
  background: rgba(227, 195, 60, 0.1); border: 1px solid var(--varning);
  border-radius: var(--radie); padding: 0.7rem 0.8rem; margin-bottom: 0.8rem;
  font-size: 0.9rem;
}

/* Utskrift: svart på vitt, inga knappar. iOS ger "Spara som PDF" härifrån. */
@media print {
  body { background: #fff; color: #000; }
  header, .bottenrad, .knapp, .knapprad { display: none !important; }
  main { padding: 0; max-width: none; }
  .kort, .skyttrad { border-color: #999; background: #fff; color: #000; }
}

/* Håll in en rad för att radera den — en omgång på startsidan, en skytt i
   registret: raden färgas röd och lämnar plats för en soptunna. Knappen ska
   vara stor nog att träffa med handskar på, och sitta i utkanten så att den
   inte trycks av misstag. */
[data-hall-radera] { touch-action: pan-y; }
.raderbar { border-color: var(--underkand); background: rgba(224, 122, 109, 0.14); }
.soptunna {
  padding: 0.5rem 0.2rem 0.5rem 0.7rem; margin-left: 0.2rem;
  font-size: 1.5rem; line-height: 1;
}
.skyttrad .soptunna { grid-column: 3; grid-row: 1 / span 2; align-self: center; }

/* Registrets rader är kort, inte vallistans knappar — men soptunnan ska hamna
   i högerkanten på samma sätt, alltså är kortet självt raden. */
.personrad {
  display: flex; align-items: center; justify-content: space-between; gap: 0.6rem;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}

/* Skyttens nummer är samma som tavlans på banan. */
.skyttrad .nr {
  display: inline-block; min-width: 1.6rem;
  color: var(--accent); font-variant-numeric: tabular-nums;
}

/* Lyft rad under drag: den ska synas ovanpå de andra och kännas lös. */
.skyttrad[data-skytt] { touch-action: pan-y; }
.skyttrad.lyft {
  border-color: var(--accent); background: var(--kort-ljus);
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.55); transform: scale(1.02);
  position: relative; z-index: 5; touch-action: none;

<script type="text/markdown" id="dok-anvandning" data-fil="anvandning.md">
Appen är ett **stöd för instruktören** vid genomförandet av kompetensproven — inte ett officiellt system, och inte utgiven av Försvarsmakten. Den räknar och håller ordning; bedömningen är din.

## Innan ni börjar

Lägg upp skyttarna en gång under **Lägg till & hantera skyttar** — namn, och därtill förband och Fmid/Anstnr om du vill ha med dem. De två sista är valfria och står grå tills något skrivs in; Fmid/Anstnr hamnar före namnet i exporten. Registret ligger kvar mellan tillfällen, så samma grupp kan skjuta både pistol och automatkarbin utan att skrivas in två gånger.

**Har du listan redan?** *Importera lista* tar hela skjutlaget på en gång i stället för en skytt i taget. Klistra in listan — ur ett mail, ett meddelande eller ett kalkylark — eller läs in en fil. En rad per skytt:

- Ek, Anna
- Berg, Bo; 1. plut
- Craf, Cia; 2. plut; CiaCra05

Fälten skiljs med **semikolon** eller tabb. Komma räknas som en del av namnet, så *Efternamn, Förnamn* fungerar, och numrering eller streck i början av raden stryks. Innan något läggs till visar appen exakt vilka som blir nya skyttar, vilka som redan finns och vilka rader den inte kunde tolka. Samma lista kan köras två gånger utan att registret blir dubbelt.

Knappen finns på två ställen och gör olika saker: under **Lägg till & hantera skyttar** fyller den registret, och under *+ Ny omgång* fyller den dessutom linjen — **ordningen i listan blir skjutordningen**, och de som redan finns i registret bockas i utan att skapas på nytt.

Överst i skyttelistan finns en genväg till *+ Ny omgång*, när registret är påfyllt och ni är redo att börja.

**Omgången kan läggas upp i förväg.** *Spara utan att starta* lägger den på startsidan märkt *ej påbörjad*, och där ligger den tills ni är på plats — öppna den då, så är den igång. Skjutordningen kan vara klar redan kvällen innan, men behöver inte vara det: en sparad omgång utan deltagare fylls på med *+ Lägg till skytt* när gruppen står på linjen.

Behöver något bort — en skytt ur registret eller en hel omgång från startsidan — **håll in raden** tills en soptunna läggs fram i den, och tryck på soptunnan. Appen frågar först, och en raderad skytt tar sina resultat med sig.

## Så går en omgång till

Appen följer hur provet genomförs: alla tiderna först, poängen när gruppen gått fram.

- **1. Lägg upp omgången.** *+ Ny omgång* — välj prov, datum, plats och instruktör, och bocka i deltagarna **i skjutordning**. Numret de får är skyttens tavelnummer på banan. *Starta omgången* går rakt in i den; *Spara utan att starta* lägger den åt sidan till senare.
- **2. Ta tiderna.** *Registrera tid för första skytt* öppnar tavla 1. Knappa tiden rakt av som den står på timern — **555** blir 5,55 — och tryck *Spara & nästa skytt*. Under knappen står vem som står på tur.
- **3. Gå fram till tavlorna.** När sista tiden är inne heter knappen *Spara & börja med poängen*, och appen står på tavla 1 i poängläget.
- **4. För in träffarna.** En tryckning per träff på respektive zon — **bättringsskotten med**. Knappa av hålen som de sitter; appen väljer ut de bästa träffarna åt dig, och räknaren i målytans rubrik säger vad som gäller: *4 av 4 — klart*, eller *(6 av 4) — de 4 bästa räknas* med siffrorna i rött när du knappat in fler än som räknas. Poängkvoten och utfallet — **Godkänd** eller **Underkänd** — räknas medan du knappar.
- **5. Registrera.** *Registrera & nästa skytt* låser försöket och går vidare. Efter sista skytten summeras omgången: *"Omgången klar — 2 av 3 godkända."*

Växeln **TID | POÄNG** visar inom parentes hur många som väntar i respektive läge, och listan står alltid i det läge som har något kvar att göra. Du behöver alltså inte hålla reda på var i omgången ni är — och en avstickare till anvisningen eller delningen tappar inte bort dig.

Vid osäker eller felaktig vapenhantering: kryssa rutan på poängskärmen, så blir försöket underkänt oavsett resultat.

## Ändra under pågående omgång

- **Fylla på:** *+ Lägg till skytt* under listan — ur registret eller en helt ny. Hen hamnar på nästa lediga tavla.
- **Byta plats:** håll in en rad tills handtagen (**☰**) visas, dra skytten dit hen ska, och tryck *Klar med ordningen*. Numret följer tavlan, inte personen.
- **Rätta en träff:** håll in zonknappen för att nolla den, och knappa in rätt. Har det blivit orimligt många träffar i en målyta säger appen till — den spärrar inget, men ett tryck för mycket ska upptäckas innan det följer med in i protokollet.
- **Byta skytt i tidfönstret:** pilarna på var sida om namnet stegar en tavla fram eller tillbaka, om något gått snett på linjen. Den påbörjade tiden sparas på vägen, och pilen slocknar när linjen är slut åt det hållet.
- **Nytt försök:** *+ Nytt försök* på skyttens rad. Provet får skjutas tre gånger; ett omtag startas alltid med flit.
- **⌂** längst upp till vänster går alltid hem. En påbörjad tid sparas på vägen.

## Dela resultatet

Tryck *Dela resultat* i omgången och välj form:

- **Text** — färdig att klistra in i ett mail.
- **PDF** — protokoll att skriva ut eller bifoga.
- **Excel** eller **CSV** — för vidare bearbetning.

Telefonen öppnar sin vanliga delningsruta, så resultatet kan mejlas, skickas som meddelande eller sparas i Filer. Listan innehåller tavelnummer, Fmid/Anstnr, namn, förband, försök, tid, träffar per zon, poäng, poängkvot och utfall — plus en summering av hur många som blev godkända. **Bättringsskotten följer inte med ut:** protokollet visar de träffar bedömningen vilar på, så zonkolumnerna summerar till kravet och poängen går att räkna efter.

En skytt räknas som godkänd i sammanställningen om **något** av försöken var godkänt.

## Säkerhetskopia

Under **Appinställningar**: *Spara kopia* ger en fil med allt, *Läs in kopia* läser tillbaka den. Det är också vägen att flytta registret till en annan telefon. Inläsning lägger till — den skriver aldrig över det som redan finns.

Kom ihåg att allt bara finns i den här telefonen. Se *Om appen* under Appinställningar — där står också *Koden på GitHub*, för den som vill läsa efter vad appen gör.

## Om reglerna

Kraven för respektive delmoment — avstånd, ställning, träffkrav och poängkvot — finns i appen under **Anvisningar för genomförande**, tillsammans med genomförandet steg för steg.

<script type="text/markdown" id="dok-hjalp" data-fil="hjalp.md">
## Vad appen är

Ett **stöd för instruktören** vid genomförandet av kompetensproven: den håller ordning på skjutordningen, räknar poängkvoten och samlar resultaten i en lista som går att dela.

Du kör **version {{utgava}}**. Numret står också längst upp till höger i appen och under Appinställningar — ha det till hands om du anmäler ett fel.

**Appen är inte utgiven av Försvarsmakten** och är inget officiellt system. Den är privat gjord, och kraven den räknar med är hämtade ur handböckerna för respektive delmoment. Kontrollera alltid mot gällande utgåva — det är instruktören som bedömer, inte appen.

## Installera på hemskärmen

Installerad startar appen som vilken app som helst och **fungerar utan täckning** — vilket är hela poängen på en skjutbana. Resultaten ligger kvar mellan gångerna.

**iPhone och iPad**

- Öppna appen i **Safari**. Andra webbläsare kan inte lägga till appen på hemskärmen i iOS.
- Tryck på delningsknappen i nederkant.
- Välj **Lägg till på hemskärmen**, och sedan **Lägg till**.

**Android**

- Öppna appen i **Chrome**.
- Tryck på menyn med de tre prickarna.
- Välj **Installera app** eller **Lägg till på startskärmen**.

Öppnar du i stället appen som en fristående HTML-fil ur ett mail fungerar den för ett enstaka tillfälle, men lagringen är opålitlig — Android kan neka den helt. Ska resultaten sparas: installera från länken.

**Uppdateringar sköter sig själva.** Appen letar efter en ny version när du startar den, och hittar den en dyker en rad upp i nederkant: *Ny version finns — tryck för att uppdatera*. Appen laddar aldrig om av sig själv — en pågående registrering avbryts alltså inte, och du väljer själv när det passar.

Hur appen används steg för steg står under **Så använder du appen** på startsidan.

## Var dina uppgifter finns

Allt du knappar in — namn, förband, Fmid/Anstnr, tider och resultat — sparas **bara i den här telefonen**, i webbläsarens lagring. Ingenting skickas någonstans. Det finns ingen server, inget konto och ingen som kan se dina listor.

Följden är att **du själv ansvarar för uppgifterna**:

- Skyttarnas namn ligger kvar i telefonen tills du raderar dem.
- Lånar du ut eller lämnar ifrån dig telefonen: radera först.
- Under Appinställningar finns **Radera allt innehåll**, och enskilda skyttar och omgångar raderas var för sig.
- Avinstallerar du appen försvinner allt — ta en säkerhetskopia först om du vill spara.

Delar du ett resultat via mail eller fil lämnar uppgifterna telefonen i det ögonblicket, och då gäller vanliga regler för hur en sådan lista får hanteras.

Det gäller åt ena hållet. Åt andra hållet: läser du in en deltagarlista eller en säkerhetskopia öppnas filen **i telefonen** och laddas inte upp någonstans. Men uppgifterna finns då i appen, och omfattas därifrån av samma ansvar som allt annat du knappat in.

## Buggar och önskemål

Fungerar något inte, eller saknas något? Skriv ett ärende:

[github.com/steeriks/fm-kompetensprov/issues](https://github.com/steeriks/fm-kompetensprov/issues)

Skriv gärna vilken **version** det gäller — den står överst till höger i appen — vilken telefon och webbläsare du har, vad du gjorde, och vad som hände i stället för det du väntade dig.

## Licens och ansvar

Appen är **fri att använda**, kopiera och ändra under MIT-licens. Koden ligger öppen — knappen *Koden på GitHub* står bredvid den här texten under Appinställningar, för den som vill läsa efter vad appen gör med uppgifterna.

Den lämnas som den är, utan garantier. Ansvaret för bedömningen, för att kraven stämmer med gällande utgåva och för hur uppgifterna hanteras ligger hos den som använder appen.

/** Avrundning till två decimaler — samma tal som visas är det som bedöms. */
function tvaDecimaler(n) {
  return Math.round(n * 100) / 100;
}

/**
 * Träffarna som RÄKNAS i en målyta, som antal per zon.
 *
 * Bästa poäng först, och vid lika poäng — C och D är båda 3 p — i zonordning.
 * Summan blir densamma hur man än väljer mellan två likvärdiga träffar, men
 * urvalet ska vara förutsägbart: samma försök ska ge samma protokoll varje
 * gång det exporteras.
 */
function raknadeIGrupp(grupp, traffar = {}) {
  const ordning = grupp.zoner
    .filter((z) => (traffar[z] || 0) > 0)
    .sort((a, b) => ZONPOANG[b] - ZONPOANG[a]
      || ZONORDNING.indexOf(a) - ZONORDNING.indexOf(b));
  const raknade = {};
  let kvar = grupp.antal;
  for (const zon of ordning) {
    if (kvar <= 0) break;
    raknade[zon] = Math.min(traffar[zon], kvar);
    kvar -= raknade[zon];
  }
  return raknade;
}

/**
 * Hela försökets räknande träffar, per zon — målytorna var för sig och sedan
 * hopslagna. Zonerna tillhör en enda målyta var, så de kan inte krocka.
 *
 * Det här är formen som går ut i protokollet: bättringsskotten knappas in i
 * appen, men det som lämnar telefonen är de träffar bedömningen vilar på.
 */
function raknadeTraffar(provKod, traffar = {}) {
  const ut = {};
  for (const g of PROV[provKod].grupper) Object.assign(ut, raknadeIGrupp(g, traffar));
  return ut;
}

/**
 * Bedömer ett försök.
 *
 * traffar: { A: 2, C: 4, ... } — antal träffar per zon, som de knappats in.
 * tid: sekunder mellan startsignal och sista skott, eller null om den inte
 *      förts in ännu.
 *
 * Returnerar poäng, poängkvot, godkänt och en lista brister i klartext. Kvoten
 * jämförs mot kravet EFTER avrundning till två decimaler: det är talet som står
 * på skärmen och i protokollet, och en app som visar 1,00 och säger underkänt
 * vore obegriplig i fält.
 */
function bedom(provKod, traffar = {}, tid = null, vapenhanteringUnderkand = false) {
  const prov = PROV[provKod];
  const brister = [];
  let poang = 0;

  const grupper = prov.grupper.map((g) => {
    // Alla hål i tavlan knappas in, bättringsskotten med. Urvalet görs av
    // raknadeIGrupp() — samma funktion som exporten läser, så protokollet och
    // poängen aldrig kan bygga på olika träffar.
    const antal = g.zoner.reduce((n, z) => n + (traffar[z] || 0), 0);
    const raknade = raknadeIGrupp(g, traffar);
    const summa = Object.entries(raknade)
      .reduce((s, [zon, n]) => s + ZONPOANG[zon] * n, 0);
    poang += summa;
    if (antal < g.antal) {
      brister.push(
        prov.grupper.length > 1
          ? `${g.namn}: ${antal} av ${g.antal} träff`
          : `${antal} av ${g.antal} träff`,
      );
    }
    return {
      id: g.id, namn: g.namn, antal, kravAntal: g.antal,
      poang: summa, over: Math.max(0, antal - g.antal),
    };
  });

  const pk = tid > 0 ? tvaDecimaler(poang / tid) : null;
  if (tid === null || tid === undefined || tid === '') brister.push('Tid saknas');
  else if (!(tid > 0)) brister.push('Ogiltig tid');
  else if (pk < prov.pkKrav) brister.push(`Poängkvot ${komma(pk)} — kravet är ${komma(prov.pkKrav)}`);
  if (vapenhanteringUnderkand) brister.push('Underkänd vapenhantering');

  return {
    poang,
    pk,
    grupper,
    brister,
    godkand: brister.length === 0,
    // Komplett = allt som behövs för en bedömning är infört. Ett försök kan
    // vara komplett och ändå underkänt; det är två olika frågor.
    komplett: tid > 0 && grupper.every((g) => g.antal >= g.kravAntal),
  };
}

/** 1.5 → "1,5" — svenskt decimaltecken överallt i gränssnitt och export. */
function komma(n, decimaler = 2) {
  if (n === null || n === undefined || Number.isNaN(n)) return '';
  return n.toFixed(decimaler).replace('.', ',');
}

/** "4,23" eller "4.23" → 4.23. Tomt eller skräp ger null. */
function taltolk(text) {
  if (text === null || text === undefined) return null;
  const rensad = String(text).trim().replace(',', '.');
  if (!rensad) return null;
  const n = Number(rensad);
  return Number.isFinite(n) ? n : null;
}

// ---- lagring.js --------------------------------------------------------
// Lagring — allt bor i telefonen, under en enda nyckel i localStorage.
//
// Ingen server, inget konto, ingenting lämnar enheten förrän du själv trycker
// på exportknappen. Priset är att lagringen sitter i webbläsaren och kan
// försvinna om den töms, och att den är opålitlig när appen öppnas som lös fil
// (file://). Därför finns säkerhetskopiering till fil, som också är vägen att
// flytta ett register till en annan telefon.

const NYCKEL = 'fm-kompetensprov';
const VERSION = 1;

// Ett tomt lager byggs varje gång i stället för att klonas från en förlaga:
// structuredClone finns inte i äldre iOS-Safari, och appen ska starta även på
// en telefon som inte uppdaterats på ett par år.
const tomtLager = () => ({ version: VERSION, personer: [], omgangar: [], resultat: [] });

let data = null;

function nyttId() {
  // Tidsstämpel + slump: sorterbart, och kan inte krocka mellan två poster
  // som skapas i samma millisekund.
  return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
}

/** Läser hela lagret. Trasigt eller saknat innehåll ger ett tomt lager. */
function las() {
  if (data) return data;
  try {
    const ratt = localStorage.getItem(NYCKEL);
    data = ratt ? JSON.parse(ratt) : tomtLager();
  } catch {
    data = tomtLager();
  }
  for (const falt of ['personer', 'omgangar', 'resultat']) {
    if (!Array.isArray(data[falt])) data[falt] = [];
  }
  data.version = VERSION;
  return data;
}

/** Skriver ner lagret. Returnerar false om utrymmet tagit slut eller nekats. */
function spara() {
  try {
    localStorage.setItem(NYCKEL, JSON.stringify(las()));
    return true;
  } catch {
    return false;
  }
}

/** Sant när lagringen faktiskt går att skriva till — falskt på lös fil i
 *  vissa webbläsare, och då ska appen säga ifrån i stället för att tappa data
 *  under tystnad. */
function lagringFungerar() {
  try {
    localStorage.setItem(NYCKEL + '-prov', '1');
    localStorage.removeItem(NYCKEL + '-prov');
    return true;
  } catch {
    return false;
  }
}

// --------------------------------------------------------------- personer

function personer() {
  return las().personer.slice().sort((a, b) => a.namn.localeCompare(b.namn, 'sv'));
}

function person(id) {
  return las().personer.find((p) => p.id === id) || null;
}

// Fmid/Anstnr är frivilligt: en hemvärnsgrupp har det sällan till hands på
// banan, medan ett förband som lämnar protokollet vidare vill ha det med.
// Poster från tidigare versioner saknar fältet — läs det alltid som `|| ''`.
function laggTillPerson(namn, forband = '', fmid = '') {
  const p = {
    id: nyttId(),
    namn: String(namn).trim(),
    forband: String(forband).trim(),
    fmid: String(fmid).trim(),
    skapad: new Date().toISOString(),
  };
  las().personer.push(p);
  spara();
  return p;
}

function andraPerson(id, namn, forband, fmid = '') {
  const p = person(id);
  if (!p) return null;
  p.namn = String(namn).trim();
  p.forband = String(forband).trim();
  p.fmid = String(fmid).trim();
  spara();
  return p;
}

/** Tar bort en person OCH alla resultat som hör till hen — annars blir det
 *  resultatrader utan ägare, och de skulle dyka upp tomma i exporten. */
function raderaPerson(id) {
  const d = las();
  d.personer = d.personer.filter((p) => p.id !== id);
  d.resultat = d.resultat.filter((r) => r.personId !== id);
  for (const o of d.omgangar) o.deltagare = o.deltagare.filter((x) => x !== id);
  spara();
}

// ------------------------------------------------- importera en skyttelista
//
// Att knappa in tjugo namn på en telefon är ett halvtimmesarbete, och listan
// finns nästan alltid redan — i ett mail, ett meddelande eller ett kalkylark.
// Det här läser en sådan lista rakt av.

/**
 * Fälten skiljs med **semikolon eller tabb**, aldrig med komma.
 *
 * Kommatecknet är inte en avgränsare därför att svenska namnlistor skrivs
 * "Efternamn, Förnamn". En lista där varje rad har precis ett komma är alltså
 * långt vanligare än en komma-CSV, och att gissa mellan dem skulle göra
 * "Ek, Anna" till en skytt vid namn Ek på förbandet Anna. Semikolonet är
 * dessutom samma tecken som appens egen CSV-export använder.
 *
 * Ren funktion: rör varken lagret eller registret.
 */
function tolkaSkyttelista(text) {
  const poster = [];
  const ogiltiga = [];
  // BOM:en följer med varje fil svensk Excel sparar, och skulle annars sitta
  // kvar i det första namnet där den syns som ingenting alls.
  const rader = String(text).replace(/^\uFEFF/, '').split(/\r?\n/);

  rader.forEach((raden, i) => {
    const utan = raden.trim();
    if (!utan) return;
    // Numrerade och punktade listor är hur ett skjutlag brukar se ut när det
    // kommer klistrat ur ett meddelande: "1. Ek, Anna" eller "- Ek, Anna".
    const ren = utan.replace(/^(?:\d{1,3}\s*[.)]|[-–—*•])\s+/, '');
    const falt = (ren.includes('\t') ? ren.split('\t') : ren.split(';'))
      .map((cell) => {
        const c = cell.trim();
        // Excel citerar celler som innehåller avgränsaren, och fördubblar
        // citattecken inuti — samma regel som appens egen CSV-export följer.
        return /^".*"$/.test(c) ? c.slice(1, -1).replace(/""/g, '"') : c;
      });

    const post = {
      namn: falt[0] || '', forband: falt[1] || '', fmid: falt[2] || '', rad: i + 1,
    };
    // Rubrikraden från ett kalkylark är inte en skytt. Bara den allra första
    // raden får strykas så här — står "Namn" längre ner är det någon som
    // faktiskt heter så. En skytt som verkligen heter Namn och råkar stå först
    // faller alltså bort, men granskningen visar vilka som läggs till innan
    // knappen trycks, så det syns.
    if (!poster.length && !ogiltiga.length && /^namn$/i.test(post.namn)) return;
    if (!post.namn) ogiltiga.push({ rad: i + 1, text: utan });
    else poster.push(post);
  });

  return { poster, ogiltiga };
}

const jamforbart = (s) => String(s || '').trim().toLowerCase().replace(/\s+/g, ' ');

/**
 * Samma person eller inte. Har båda ett Fmid är det Fmid som avgör och inget
 * annat — två skyttar kan heta likadant, och då ska båda in. Saknas Fmid på
 * någondera sidan finns bara namnet att gå på.
 */
function sammaSkytt(a, b) {
  if (a.fmid && b.fmid) return jamforbart(a.fmid) === jamforbart(b.fmid);
  return jamforbart(a.namn) === jamforbart(b.namn);
}

/**
 * Tolkar listan och håller den mot registret, utan att skriva något. Samma
 * löfte som säkerhetskopian ger: en import lägger till, den skriver aldrig
 * över — och en lista som körs två gånger ger inte registret i dubbel upplaga.
 *
 * Vyn kallar den vid varje tangenttryck för att visa vad som faktiskt kommer
 * att hända, och en gång till när knappen trycks.
 */
function granskaSkyttelista(text) {
  const { poster, ogiltiga } = tolkaSkyttelista(text);
  const befintliga = las().personer;
  const nya = [];
  const dubbletter = [];
  for (const post of poster) {
    // Också mot dem som redan hunnit hamna i `nya`: en lista kan innehålla
    // samma namn två gånger, och då ska den andra raden inte bli en skytt till.
    if (befintliga.some((p) => sammaSkytt(post, p)) || nya.some((p) => sammaSkytt(post, p))) {
      dubbletter.push(post);
    } else {
      nya.push(post);
    }
  }
  return { nya, dubbletter, ogiltiga };
}

/** Lägger in de granskade posterna. Går via laggTillPerson, så att det bara
 *  finns ett ställe som vet vad en skytt är för något. */
function laggTillSkyttar(poster) {
  for (const p of poster) laggTillPerson(p.namn, p.forband, p.fmid);
  return poster.length;
}

/**
 * Hela importen i ett steg: granskar, lägger in det som är nytt, och svarar
 * med **id:n för varje skytt listan pekade ut** — de nyss skapade och de som
 * redan fanns, i den ordning de stod i listan.
 *
 * Ordningen är hela poängen när importen görs inifrån en omgång: en
 * deltagarlista kommer nästan alltid i skjutordning, och då ska tavlorna
 * delas ut i samma ordning. De som redan står i registret måste därför följa
 * med i svaret, trots att de inte skapades här — annars hoppade omgången över
 * dem och skjutordningen blev en annan än den man klistrade in.
 */
function importeraSkyttar(text) {
  const granskning = granskaSkyttelista(text);
  laggTillSkyttar(granskning.nya);
  const registret = las().personer;
  const idn = [];
  for (const post of tolkaSkyttelista(text).poster) {
    const p = registret.find((x) => sammaSkytt(post, x));
    if (p && !idn.includes(p.id)) idn.push(p.id);
  }
  return { ...granskning, idn };
}

// --------------------------------------------------------------- omgångar

function omgangar() {
  return las().omgangar.slice().sort((a, b) =>
    (b.datum + b.id).localeCompare(a.datum + a.id));
}

function omgang(id) {
  return las().omgangar.find((o) => o.id === id) || null;
}

function laggTillOmgang({ gren, datum, plats = '', instruktor = '', deltagare = [] }) {
  const o = {
    id: nyttId(),
    gren,
    datum: datum || new Date().toISOString().slice(0, 10),
    plats: plats.trim(),
    instruktor: instruktor.trim(),
    deltagare: deltagare.slice(),
    skapad: new Date().toISOString(),
  };
  las().omgangar.push(o);
  spara();
  return o;
}

function andraOmgang(id, andringar) {
  const o = omgang(id);
  if (!o) return null;
  Object.assign(o, andringar);
  spara();
  return o;
}

function raderaOmgang(id) {
  const d = las();
  d.omgangar = d.omgangar.filter((o) => o.id !== id);
  d.resultat = d.resultat.filter((r) => r.omgangId !== id);
  spara();
}

// --------------------------------------------------------------- resultat

/** Alla försök i en omgång, äldst först. */
function resultat(omgangId) {
  return las().resultat.filter((r) => r.omgangId === omgangId)
    .sort((a, b) => a.forsok - b.forsok);
}

/** En skytts försök i en omgång, äldst först. */
function resultatFor(omgangId, personId) {
  return resultat(omgangId).filter((r) => r.personId === personId);
}

/**
 * Det försök som pågår för en skytt: det senaste som ännu inte registrerats.
 * Finns inget sådant skapas ett nytt. Det är den här funktionen som gör att
 * tidssvepet och poängsvepet hittar tillbaka till samma rad — instruktören
 * knappar in tiderna på hela linjen först och poängen långt senare.
 */
function pagaende(omgangId, personId, skapaOmSaknas = true) {
  const alla = resultatFor(omgangId, personId);
  const oppet = alla.find((r) => !r.registrerad);
  if (oppet) return oppet;
  if (!skapaOmSaknas) return null;
  const r = {
    id: nyttId(),
    omgangId,
    personId,
    forsok: alla.length + 1,
    tid: null,
    traffar: {},
    vapenhanteringUnderkand: false,
    registrerad: null,
  };
  las().resultat.push(r);
  spara();
  return r;
}

function andraResultat(id, andringar) {
  const r = las().resultat.find((x) => x.id === id);
  if (!r) return null;
  Object.assign(r, andringar);
  spara();
  return r;
}

/** Låser försöket. Efter det startar nästa tryck ett nytt försök i stället. */
function registrera(id) {
  return andraResultat(id, { registrerad: new Date().toISOString() });
}

function raderaResultat(id) {
  const d = las();
  d.resultat = d.resultat.filter((r) => r.id !== id);
  spara();
}

// ------------------------------------------------- säkerhetskopia och nollställning

function sakerhetskopia() {
  return JSON.stringify({ ...las(), exporterad: new Date().toISOString() }, null, 1);
}

/**
 * Läser in en säkerhetskopia. Lägger till i stället för att skriva över:
 * poster med id som redan finns hoppas över, så att en inläsning två gånger
 * inte ger dubbletter och så att två telefoners listor kan slås ihop.
 */
function lasInSakerhetskopia(text) {
  const inkommande = JSON.parse(text);
  if (!inkommande || typeof inkommande !== 'object') throw new Error('Filen ser inte ut som en säkerhetskopia.');
  const d = las();
  const rakning = { personer: 0, omgangar: 0, resultat: 0 };
  for (const falt of ['personer', 'omgangar', 'resultat']) {
    if (!Array.isArray(inkommande[falt])) continue;
    const fanns = new Set(d[falt].map((x) => x.id));
    for (const post of inkommande[falt]) {
      if (post && post.id && !fanns.has(post.id)) {
        d[falt].push(post);
        rakning[falt]++;
      }
    }
  }
  spara();
  return rakning;
}

function raderaAllt() {
  data = tomtLager();
  try {
    localStorage.removeItem(NYCKEL);
  } catch {
    /* redan borta */
  }
  spara();
}

const lager = { las, spara, lagringFungerar, personer, person, laggTillPerson, andraPerson, raderaPerson, tolkaSkyttelista, granskaSkyttelista, laggTillSkyttar, importeraSkyttar, omgangar, omgang, laggTillOmgang, andraOmgang, raderaOmgang, resultat, resultatFor, pagaende, andraResultat, registrera, raderaResultat, sakerhetskopia, lasInSakerhetskopia, raderaAllt };

// ---- export.js ---------------------------------------------------------
// Export — samma underlag i fyra former: text, CSV, XLSX och PDF.
//
// Inga bibliotek. Appen ska vara en enda fil utan en enda extern begäran, och
// då kan den inte luta sig mot en CDN. XLSX är en ZIP med XML som skrivs
// okomprimerad (STORED) — giltigt, och ingen deflate behöver implementeras.
// PDF:en byggs för hand med inbyggd Helvetica och WinAnsi, som täcker å ä ö.


// ------------------------------------------------------------- underlaget

/** Bygger tabellen som alla fyra formaten skriver ut. */
function underlag(omgang, personer, resultat) {
  const prov = PROV[omgang.gren];
  const zoner = ZONORDNING;
  const kolumner = [
    // Numret är skyttens plats i skjutordningen — och därmed tavelnumret på
    // banan. Det är det man matchar mot när protokollet läses efteråt.
    // Fmid/Anstnr står före namnet: det är den identitet ett förband matchar
    // protokollet mot, och den är tom för den som inte fyllt i något.
    'Nr', 'Fmid/Anstnr', 'Namn', 'Förband', 'Försök', 'Tid (s)',
    ...zoner.map((z) => `${z} (${{ A: 5, B: 4, C: 3, D: 3, X: 2, H: 1 }[z]}p)`),
    'Poäng', 'PK', 'Utfall', 'Anmärkning',
  ];
  const rader = [];
  let godkanda = 0;
  for (const [index, id] of omgang.deltagare.entries()) {
    const p = personer.find((x) => x.id === id);
    if (!p) continue;
    const nr = index + 1;
    const forsok = resultat.filter((r) => r.personId === id && r.registrerad);
    if (!forsok.length) {
      rader.push({
        person: p, nr, forsok: null,
        celler: [nr, p.fmid || '', p.namn, p.forband, '', '',
          ...zoner.map(() => ''), '', '', 'Ej skjuten', ''],
      });
      continue;
    }
    // Godkänd på något av försöken räcker — provet får skjutas tre gånger.
    if (forsok.some((r) => bedom(omgang.gren, r.traffar, r.tid, r.vapenhanteringUnderkand).godkand)) {
      godkanda++;
    }
    for (const r of forsok) {
      const b = bedom(omgang.gren, r.traffar, r.tid, r.vapenhanteringUnderkand);
      // Protokollet visar de träffar bedömningen vilar på, inte varje hål i
      // tavlan. Bättringsskotten hör hemma i appen, där instruktören knappar;
      // det som lämnar telefonen ska gå att lägga bredvid poängen och summera
      // utan att någon behöver veta vilka träffar som föll bort.
      const traffar = raknadeTraffar(omgang.gren, r.traffar);
      rader.push({
        person: p, nr, forsok: r, bedomning: b, traffar,
        celler: [
          nr, p.fmid || '', p.namn, p.forband, r.forsok, r.tid === null ? '' : komma(r.tid),
          ...zoner.map((z) => traffar[z] || 0),
          b.poang, b.pk === null ? '' : komma(b.pk),
          b.godkand ? 'Godkänd' : 'Underkänd',
          b.godkand ? '' : b.brister.join('; '),
        ],
      });
    }
  }
  return {
    omgang, prov, kolumner, rader,
    antalSkyttar: omgang.deltagare.length,
    godkanda,
    rubrik: `${prov.namn} — ${prov.delmoment}`,
    filnamn: `kompetensprov-${prov.kod}-${omgang.datum}`,
  };
}

/**
 * Kort form av bristerna, för PDF-tabellens smala kolumn. Text och CSV får
 * den fullständiga formuleringen — där finns plats, och den ska gå att läsa
 * utan att kunna appens förkortningar.
 */
function kortAnmarkning(bedomning) {
  if (!bedomning) return '';
  return bedomning.brister.map((b) => b
    .replace(/^Poängkvot (\S+) — kravet är (\S+)$/, 'PK $1 < $2')
    .replace(/^(\w+): (\d+) av (\d+) träff$/, '$1 $2/$3')
    .replace(/^(\d+) av (\d+) träff$/, '$1/$2 träff')
    .replace(/^Underkänd vapenhantering$/, 'Vapenhantering'),
  ).join('; ');
}

function huvudrader(u) {
  const o = u.omgang;
  return [
    u.rubrik,
    `${o.datum}${o.plats ? ' · ' + o.plats : ''}${o.instruktor ? ' · Instruktör: ' + o.instruktor : ''}`,
    `${u.prov.avstand}, ${u.prov.mal} · Krav: poängkvot ${komma(u.prov.pkKrav)}`,
  ];
}

// ------------------------------------------------------------------- text

function somText(u) {
  const rader = [...huvudrader(u), ''];
  let nuvarande = null;
  for (const rad of u.rader) {
    if (rad.person.id !== nuvarande) {
      nuvarande = rad.person.id;
      rader.push(`${rad.nr}. ${rad.person.fmid ? rad.person.fmid + ' · ' : ''}${rad.person.namn}`
        + `${rad.person.forband ? ' (' + rad.person.forband + ')' : ''}`);
    }
    if (!rad.forsok) {
      rader.push('   Ej skjuten');
      continue;
    }
    const b = rad.bedomning;
    const traffar = ZONORDNING.filter((z) => rad.traffar[z])
      .map((z) => `${z}${rad.traffar[z]}`).join(' ');
    rader.push(
      `   Försök ${rad.forsok.forsok}: ${komma(rad.forsok.tid)} s · ${traffar || 'inga träffar'}` +
      ` · ${b.poang} p · PK ${komma(b.pk)} · ${b.godkand ? 'GODKÄND' : 'UNDERKÄND'}` +
      (b.godkand ? '' : ` (${b.brister.join('; ')})`),
    );
  }
  rader.push('', `${u.godkanda} av ${u.antalSkyttar} godkända.`);
  return rader.join('\n');
}

// -------------------------------------------------------------------- CSV

function somCsv(u) {
  const cell = (v) => {
    const s = String(v ?? '');
    return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const rader = [
    ...huvudrader(u).map((r) => cell(r)),
    '',
    u.kolumner.map(cell).join(';'),
    ...u.rader.map((rad) => rad.celler.map(cell).join(';')),
    '',
    cell(`${u.godkanda} av ${u.antalSkyttar} godkända`),
  ];
  // Semikolon och BOM: svensk Excel öppnar då filen rätt utan importdialog,
  // och å ä ö blir inte förvanskade.
  return '﻿' + rader.join('\r\n') + '\r\n';
}

// ------------------------------------------------------------------- XLSX
//
// En xlsx är en ZIP med några XML-delar. Vi skriver posterna okomprimerade,
// vilket formatet tillåter — då slipper vi en deflate-implementation, och
// Excel bryr sig inte.

const CRC_TABELL = (() => {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
    t[i] = c >>> 0;
  }
  return t;
})();

function crc32(bytes) {
  let c = 0xffffffff;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABELL[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
  return (c ^ 0xffffffff) >>> 0;
}

function zip(filer) {
  const kodare = new TextEncoder();
  const delar = [];
  const katalog = [];
  let offset = 0;
  const u16 = (n) => [n & 0xff, (n >>> 8) & 0xff];
  const u32 = (n) => [n & 0xff, (n >>> 8) & 0xff, (n >>> 16) & 0xff, (n >>> 24) & 0xff];

  for (const fil of filer) {
    const namn = kodare.encode(fil.namn);
    const data = typeof fil.data === 'string' ? kodare.encode(fil.data) : fil.data;
    const crc = crc32(data);
    // Flagga 0x0800 = filnamnen är UTF-8. Tid/datum lämnas nollade; det är
    // giltigt och gör bygget deterministiskt.
    const huvud = [
      ...u32(0x04034b50), ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0),
      ...u32(crc), ...u32(data.length), ...u32(data.length),
      ...u16(namn.length), ...u16(0),
    ];
    delar.push(new Uint8Array(huvud), namn, data);
    katalog.push({ namn, crc, storlek: data.length, offset });
    offset += huvud.length + namn.length + data.length;
  }

  const katalogDelar = [];
  let katalogStorlek = 0;
  for (const post of katalog) {
    const huvud = [
      ...u32(0x02014b50), ...u16(20), ...u16(20), ...u16(0x0800), ...u16(0),
      ...u16(0), ...u16(0), ...u32(post.crc), ...u32(post.storlek), ...u32(post.storlek),
      ...u16(post.namn.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0),
      ...u32(0), ...u32(post.offset),
    ];
    katalogDelar.push(new Uint8Array(huvud), post.namn);
    katalogStorlek += huvud.length + post.namn.length;
  }
  const slut = new Uint8Array([
    ...u32(0x06054b50), ...u16(0), ...u16(0),
    ...u16(katalog.length), ...u16(katalog.length),
    ...u32(katalogStorlek), ...u32(offset), ...u16(0),
  ]);

  const allt = [...delar, ...katalogDelar, slut];
  const total = allt.reduce((n, d) => n + d.length, 0);
  const ut = new Uint8Array(total);
  let p = 0;
  for (const d of allt) { ut.set(d, p); p += d.length; }
  return ut;
}

const xmlEsc = (s) => String(s ?? '')
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;');

function kolumnBokstav(i) {
  let s = '';
  i += 1;
  while (i > 0) {
    const rest = (i - 1) % 26;
    s = String.fromCharCode(65 + rest) + s;
    i = Math.floor((i - 1) / 26);
  }
  return s;
}

function somXlsx(u) {
  const arkRader = [];
  const skrivRad = (radnr, celler, fet = false) => {
    const c = celler.map((v, i) => {
      const ref = kolumnBokstav(i) + radnr;
      const stil = fet ? ' s="1"' : '';
      if (typeof v === 'number' && Number.isFinite(v)) {
        return `<c r="${ref}"${stil}><v>${v}</v></c>`;
      }
      if (v === '' || v === null || v === undefined) return `<c r="${ref}"${stil}/>`;
      return `<c r="${ref}"${stil} t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;
    }).join('');
    arkRader.push(`<row r="${radnr}">${c}</row>`);
  };

  let rad = 1;
  for (const text of huvudrader(u)) skrivRad(rad++, [text], true);
  rad++;
  skrivRad(rad++, u.kolumner, true);
  for (const r of u.rader) {
    // Tid och PK som text med komma vore obrukbart i kalkyl — skriv tal.
    const celler = r.celler.map((v) => {
      if (typeof v === 'string' && /^-?\d+,\d+$/.test(v)) return Number(v.replace(',', '.'));
      return v;
    });
    skrivRad(rad++, celler);
  }
  rad++;
  skrivRad(rad++, [`${u.godkanda} av ${u.antalSkyttar} godkända`], true);

  const ns = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';
  const filer = [
    {
      namn: '[Content_Types].xml',
      data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>
<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>
</Types>`,
    },
    {
      namn: '_rels/.rels',
      data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
</Relationships>`,
    },
    {
      namn: 'xl/workbook.xml',
      data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="${ns}" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<sheets><sheet name="Resultat" sheetId="1" r:id="rId1"/></sheets></workbook>`,
    },
    {
      namn: 'xl/_rels/workbook.xml.rels',
      data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>
<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
</Relationships>`,
    },
    {
      namn: 'xl/styles.xml',
      data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="${ns}">
<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts>
<fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills>
<borders count="1"><border/></borders>
<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
<cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs>
<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>
</styleSheet>`,
    },
    {
      namn: 'xl/worksheets/sheet1.xml',
      data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="${ns}"><sheetData>${arkRader.join('')}</sheetData></worksheet>`,
    },
  ];
  return zip(filer);
}

// -------------------------------------------------------------------- PDF
//
// Ett minimalt PDF-dokument: inbyggd Helvetica (finns i alla läsare, ingen
// font behöver bäddas in) med WinAnsiEncoding, som täcker å ä ö.

const SIDBREDD = 595;   // A4 i punkter
const SIDHOJD = 842;
const MARGINAL = 36;

function winAnsi(text) {
  // WinAnsi ligger nära Latin-1 för det vi behöver. Tecken utanför byts mot
  // frågetecken hellre än att ge en trasig fil.
  const ut = [];
  const SARSKILDA = {
    0x2013: 0x96,   // – kort tankstreck
    0x2014: 0x97,   // — långt tankstreck
    0x2018: 0x91, 0x2019: 0x92,
    0x201c: 0x93, 0x201d: 0x94,
    0x2022: 0x95,   // punktlista
    0x2026: 0x85,   // … avbrott — utan den här raden blev kapad text "?"
  };
  for (const tecken of String(text)) {
    const k = tecken.codePointAt(0);
    if (SARSKILDA[k]) ut.push(SARSKILDA[k]);
    else if (k < 256) ut.push(k);
    else ut.push(0x3f);
  }
  return ut;
}

function pdfText(text) {
  const ut = [];
  for (const b of winAnsi(text)) {
    if (b === 0x28 || b === 0x29 || b === 0x5c) ut.push(0x5c);  // ( ) \
    ut.push(b);
  }
  return ut;
}

/** Ungefärlig textbredd i punkter — räcker för att kapa text som inte får
 *  plats i sin kolumn. Helvetica är ~0,5 em i snitt för gemener. */
function bredd(text, storlek) {
  return String(text).length * storlek * 0.52;
}

function kapa(text, storlek, maxbredd) {
  let s = String(text ?? '');
  if (bredd(s, storlek) <= maxbredd) return s;
  while (s.length > 1 && bredd(s + '…', storlek) > maxbredd) s = s.slice(0, -1);
  return s + '…';
}

function somPdf(u) {
  // Kolumnbredderna måste summera till sidbredden minus båda marginalerna
  // (595 − 72 = 523 pt), annars hamnar sista kolumnen utanför pappret.
  // Fmid/Anstnr fick sina 64 pt ur anmärkningen, förbandet och två pt per
  // zonkolumn — de rymmer en siffra och behövde aldrig sina 18. Bredden är
  // tilltagen med marginal: ett id som kapas med "…" är värdelöst i just den
  // kolumn som ska peka ut en människa, och Fmid/Anstnr skrivs olika långt.
  const kol = [
    { rubrik: 'Nr', bredd: 16 },
    { rubrik: 'Fmid/Anstnr', bredd: 64 },
    { rubrik: 'Namn', bredd: 84 },
    { rubrik: 'Förband', bredd: 46 },
    { rubrik: 'F', bredd: 12 },
    { rubrik: 'Tid', bredd: 30 },
    ...ZONORDNING.map((z) => ({ rubrik: z, bredd: 16 })),
    { rubrik: 'Poäng', bredd: 30 },
    { rubrik: 'PK', bredd: 28 },
    { rubrik: 'Utfall', bredd: 46 },
    { rubrik: 'Anmärkning', bredd: 71 },
  ];
  const summa = kol.reduce((n, k) => n + k.bredd, 0);
  if (summa > SIDBREDD - 2 * MARGINAL) {
    throw new Error(`Kolumnerna är ${summa} pt breda, sidan rymmer ${SIDBREDD - 2 * MARGINAL}`);
  }

  const sidor = [];
  let strommar = [];
  let y = 0;

  const nySida = () => {
    strommar = [];
    sidor.push(strommar);
    y = SIDHOJD - MARGINAL;
  };
  const skriv = (text, x, storlek, fet) => {
    strommar.push(
      `BT /${fet ? 'F2' : 'F1'} ${storlek} Tf 1 0 0 1 ${x} ${y} Tm (` +
      String.fromCharCode(...pdfText(text)) + ') Tj ET',
    );
  };
  const rad = (celler, storlek, fet) => {
    let x = MARGINAL;
    celler.forEach((v, i) => {
      skriv(kapa(v, storlek, kol[i].bredd - 3), x, storlek, fet);
      x += kol[i].bredd;
    });
    y -= storlek + 4;
  };

  nySida();
  for (const text of huvudrader(u)) {
    skriv(text, MARGINAL, text === u.rubrik ? 14 : 9, text === u.rubrik);
    y -= (text === u.rubrik ? 14 : 9) + 6;
  }
  y -= 6;
  rad(kol.map((k) => k.rubrik), 8, true);
  y -= 2;

  for (const r of u.rader) {
    if (y < MARGINAL + 40) {
      nySida();
      rad(kol.map((k) => k.rubrik), 8, true);
      y -= 2;
    }
    // Nollor i zonkolumnerna görs tomma — en tabell full av nollor är svårare
    // att läsa än en gles. Sista kolumnen får den korta anmärkningen.
    const celler = r.celler.map((v) => (v === 0 ? '' : v));
    celler[celler.length - 1] = kortAnmarkning(r.bedomning);
    rad(celler, 8, false);
  }
  y -= 8;
  if (y < MARGINAL) nySida();
  skriv(`${u.godkanda} av ${u.antalSkyttar} godkända.`, MARGINAL, 9, true);

  // --- sätt ihop filen; xref kräver byteoffset för varje objekt ---
  const bitar = [];
  let langd = 0;
  const skrivBytes = (bytes) => { bitar.push(bytes); langd += bytes.length; };
  const skrivRad = (text) => skrivBytes(new Uint8Array(winAnsi(text + '\n')));

  const objekt = [];
  const sidObjektNr = (i) => 4 + i * 2;          // sida, sedan dess innehåll
  const antalSidor = sidor.length;
  const fontNr = 4 + antalSidor * 2;

  skrivRad('%PDF-1.4');
  const laggObjekt = (nr, kropp, strom) => {
    objekt[nr] = langd;
    skrivRad(`${nr} 0 obj`);
    skrivRad(kropp);
    if (strom !== undefined) {
      skrivRad('stream');
      skrivBytes(new Uint8Array(winAnsi(strom)));
      skrivRad('');
      skrivRad('endstream');
    }
    skrivRad('endobj');
  };

  laggObjekt(1, '<< /Type /Catalog /Pages 2 0 R >>');
  const barn = sidor.map((_, i) => `${sidObjektNr(i)} 0 R`).join(' ');
  laggObjekt(2, `<< /Type /Pages /Kids [${barn}] /Count ${antalSidor} >>`);
  laggObjekt(3, '<< >>');   // platshållare så numreringen blir läsbar

  sidor.forEach((strom, i) => {
    const innehall = strom.join('\n');
    const bytes = winAnsi(innehall).length;
    laggObjekt(sidObjektNr(i),
      `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${SIDBREDD} ${SIDHOJD}] ` +
      `/Resources << /Font << /F1 ${fontNr} 0 R /F2 ${fontNr + 1} 0 R >> >> ` +
      `/Contents ${sidObjektNr(i) + 1} 0 R >>`);
    laggObjekt(sidObjektNr(i) + 1, `<< /Length ${bytes} >>`, innehall);
  });

  laggObjekt(fontNr, '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  laggObjekt(fontNr + 1, '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');

  const antalObjekt = fontNr + 2;
  const xrefPos = langd;
  skrivRad('xref');
  skrivRad(`0 ${antalObjekt}`);
  skrivRad('0000000000 65535 f ');
  for (let nr = 1; nr < antalObjekt; nr++) {
    skrivRad(String(objekt[nr] ?? 0).padStart(10, '0') + ' 00000 n ');
  }
  skrivRad('trailer');
  skrivRad(`<< /Size ${antalObjekt} /Root 1 0 R >>`);
  skrivRad('startxref');
  skrivRad(String(xrefPos));
  skrivRad('%%EOF');

  const ut = new Uint8Array(langd);
  let p = 0;
  for (const b of bitar) { ut.set(b, p); p += b.length; }
  return ut;
}

// --------------------------------------------------------- dela eller spara

const MIME = {
  txt: 'text/plain',
  csv: 'text/csv',
  xlsx: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
  pdf: 'application/pdf',
};

/**
 * Skickar filen till delningsrutan (som öppnar Mail på både iPhone och
 * Android). Går det inte laddas den ned i stället. Returnerar vad som hände,
 * så att gränssnittet kan säga det rakt ut.
 */
async function dela(filnamn, innehall, format, text = '') {
  const blob = new Blob([innehall], { type: MIME[format] });
  const fil = new File([blob], filnamn, { type: MIME[format] });
  if (navigator.canShare && navigator.canShare({ files: [fil] })) {
    try {
      await navigator.share({ files: [fil], title: filnamn, text });
      return 'delad';
    } catch (fel) {
      if (fel && fel.name === 'AbortError') return 'avbruten';
      // Faller igenom till nedladdning
    }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filnamn;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  return 'nedladdad';
}

// ---- app.js ------------------------------------------------------------
// FM kompetensprov — gränssnitt och flöde.
//
// Appen följer hur provet faktiskt går till: instruktören skjuter en skytt i
// taget och knappar in TIDERNA för hela linjen, går sedan fram till tavlorna
// och knappar in POÄNGEN för samma skyttar i samma ordning. Därför har
// vallistan två lägen i stället för ett formulär per skytt — och därför finns
// "Nästa som saknar …", som är hela svepet i en knapp.




// Versionen bakas in i metataggen av bygg.py. Serveras src/ direkt står det
// "utveckling" där, vilket är sanningen i det läget. Namnet är UTGAVA och inte
// VERSION: bygget lägger alla moduler i EN scope, och lagring.js har redan en
// VERSION för lagringsformatet — kollisionen ger ett rått SyntaxError i appen.
const UTGAVA = document.querySelector('meta[name="version"]')?.content || 'utveckling';

const app = document.getElementById('app');
const bottenrad = document.getElementById('bottenrad');
const rubrikText = document.getElementById('rubriktext');
const underrubrik = document.getElementById('underrubrik');
const hemKnapp = document.getElementById('hem');
const uppdateringsrad = document.getElementById('uppdatering');
document.getElementById('utgava').textContent = `v${UTGAVA}`;
const stegaKnappar = [document.getElementById('stegabak'), document.getElementById('stegafram')];

// Vy, och vad vyn handlar om. Ingen router — appen är en enda skärm i taget
// och webbläsarens bakåtknapp hanteras med history.state.
let vy = { namn: 'start' };
let utkastTid = '';       // sifferknappsatsens buffert, som den knappats in

/**
 * Tolkar knappsatsens buffert som en tid i sekunder.
 *
 * Utan komma är de två sista siffrorna hundradelar: 555 blir 5,55 och 6667
 * blir 66,67. Det är så en skjuttimer läses av — man knappar in siffrorna man
 * ser, utan att leta efter kommatecknet med handskar på. Skriver man ett komma
 * gäller det i stället, för den som hellre gör så.
 */
function tolkadTid(text) {
  if (!text) return null;
  if (text.includes(',')) return taltolk(text);
  const n = taltolk(text);
  return n === null ? null : n / 100;
}

/** Skriver om enbart siffervisningen. Att rita om hela vyn per knapptryck
 *  gör att knappsatsen byggs upp på nytt mitt under fingret — det syns som
 *  flimmer, och gamla elementreferenser dör. */
function uppdateraTidvisning() {
  const ruta = app.querySelector('.tidvisning');
  if (!ruta) return;
  ruta.classList.toggle('tom', !utkastTid);
  ruta.firstChild.textContent = visadTid(utkastTid) || '0,00';
}

/** Vad som står i den stora siffervisningen medan man knappar. */
function visadTid(text) {
  if (!text) return '';
  if (text.includes(',')) return text;        // visa som det skrivs
  const v = tolkadTid(text);
  return v === null ? text : komma(v);
}

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/**
 * Sätter rubriken. Med ett nummer skrivs det som en egen färgad del framför
 * namnet — står man med en skytt ska tavelnumret gå att läsa på avstånd, i
 * samma färg som i vallistan, utan att man behöver leta i undertexten.
 */
function sattRubrik(text, nr = null) {
  rubrikText.innerHTML = (nr ? `<span class="nr">${esc(nr)}.</span> ` : '') + esc(text);
}

function vibrera(ms = 20) {
  if (navigator.vibrate) navigator.vibrate(ms);
}

function flash(text, sekunder = 2.5) {
  document.querySelectorAll('.flash').forEach((e) => e.remove());
  const d = document.createElement('div');
  d.className = 'flash';
  d.textContent = text;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), sekunder * 1000);
}

/**
 * Byter vy. `ersatt` lägger den nya vyn i stället för den nuvarande i
 * historiken, i stället för ovanpå. Det används varje gång vi går tillbaka
 * till vallistan eller vidare till nästa skytt: annars växer stacken med en
 * post per knappsatsskärm, och bakåtknappen skulle vandra baklänges genom
 * hela skjutlaget i stället för att lämna listan.
 */
function gaTill(namn, extra = {}, ersatt = false) {
  vy = { namn, ...extra };
  utkastTid = '';
  if (ersatt) history.replaceState(vy, '');
  else history.pushState(vy, '');
  rita();
}

window.addEventListener('popstate', (e) => {
  vy = e.state || { namn: 'start' };
  rita();
});

  sattRubrik('FM kompetensprov');
  underrubrik.textContent = 'Pistol och automatkarbin';

  // leder — men syntes ändå, eftersom `hidden` förlorade mot `.hem`s egen
  // display-regel. När den buggen rättades försvann en ikon som hunnit bli
  // en del av bilden, och den ska vara kvar: rubrikraden ska se likadan ut
  // överallt, så att blicken hittar samma sak på varje skärm.
  hemKnapp.hidden = false;

      .filter((r) => bedom(o.gren, r.traffar, r.tid, r.vapenhanteringUnderkand).godkand)

      + 'soptunnan som raderar den.</p>' : '');

    <div class="knapprad">
      <button class="knapp liten smal" data-dok="anvandning">Så använder du appen</button>

      .map(([z, n]) => `${z}${n}`).join(' ');

      <span>Försök ${r.forsok} · ${komma(r.tid)} s · ${esc(traffar || 'inga träffar')}</span>
      <span>${b.poang} p · <b>${komma(b.pk)}</b> ·
        <span class="${b.godkand ? 'chip g' : 'chip u'}">${b.godkand ? 'G' : 'U'}</span></span>
    </div>`;
  }).join('')}</div>`;
}

/**
 * Vem som står på tur efter den skytt vars tid just knappas in, och med vad.
 *
 * Saknar någon annan sin tid är det tid som gäller. Har alla fått sin tid är
 * nästa steg poängen, och då pekas den första skytten i ordningen ut — man går
 * fram till tavlorna och börjar om från tavla 1. Den skytt som just nu står
 * öppen räknas med, eftersom hen får sin tid i samma knapptryck.
 */
/**
 * Nästa skytt som behöver det här läget — någon ANNAN än den man står på.
 * nastaSkytt varvar om från listans början och hittar annars skytten man
 * redan är inne hos, eftersom hen ännu inte fått det som saknas. Hen är inte
 * "nästa" — hen är den här.
 */
function nastaAnnan(omgang, lage, personId) {
  const id = nastaSkytt(omgang, lage, personId);
  return id && id !== personId ? id : null;
}

function nastaEfterTid(omgang, personId) {
  const utanTid = nastaAnnan(omgang, 'tid', personId);
  if (utanTid) return { typ: 'tid', id: utanTid };
  for (const id of omgang.deltagare) {
    const r = lager.pagaende(omgang.id, id, false);
    if (r && (r.tid !== null || id === personId)) return { typ: 'poang', id };
  }
  return null;
}

/**
 * Går skytten att öppna i tidfönstret? Samma villkor som `oppnaSkytt` ställer:
 * en färdig skytt behöver "+ Nytt försök" först och ska inte gå att stega in
 * i, för då skulle ett omtag startas av ett pilklick.
 */
function garAttOppna(omgang, personId) {
  const alla = lager.resultatFor(omgang.id, personId);
  return !alla.length || alla.some((r) => !r.registrerad);
}

/**
 * Skytten en stegning bort i skjutordningen, eller null vid linjens slut.
 *
 * Stegningen går INTE runt. Fastnar man i kanten ska pilen slockna, inte
 * kasta en till andra änden av linjen — i mörker är ett hopp från tavla 1
 * till tavla 8 omöjligt att skilja från ett feltryck.
 */
function stegadSkytt(omgang, personId, riktning) {
  const nu = omgang.deltagare.indexOf(personId);
  if (nu < 0) return null;
  for (let i = nu + riktning; i >= 0 && i < omgang.deltagare.length; i += riktning) {
    if (garAttOppna(omgang, omgang.deltagare[i])) return omgang.deltagare[i];
  }
  return null;
}

/**
 * Tilltalsnamnet, till knappar där hela namnet inte får plats.
 *
 * Registret skrivs "Efternamn, Förnamn" — det är så en skyttelista ser ut —
 * så ett naivt `namn.split(' ')[0]` gav "Ek," på knappen: efternamnet, med
 * kommatecknet kvar. Kommat avgör alltså vilken del som är förnamnet. Utan
 * komma antas "Anna Ek", och slutar namnet med ett komma finns bara det som
 * står före det att gå på.
 */
function tilltalsnamn(namn) {
  const rensat = String(namn).trim();
  const komma = rensat.indexOf(',');
  const del = komma === -1 ? rensat
    : (rensat.slice(komma + 1).trim() || rensat.slice(0, komma).trim());
  return del.split(/\s+/)[0] || rensat;
}

/** "1 skytt" men "3 skyttar". Entalsformen är lätt att glömma i en mall och
 *  syns direkt på skärmen när den saknas. */
function antalOrd(n, ental, flertal) {
  return `${n} ${n === 1 ? ental : flertal}`;
}

/** "3. Ek, Anna" — numret är tavlan, som överallt annars. */
function skyttEtikett(omgang, personId) {
  const p = lager.person(personId);
  if (!p) return '';
  return `${omgang.deltagare.indexOf(personId) + 1}. ${p.namn}`;
}

// ----------------------------------------------------------------- tiden

function ritaTid() {
  const o = lager.omgang(vy.omgangId);
  const p = lager.person(vy.personId);
  if (!o || !p) return gaTill('start');
  const r = lager.pagaende(o.id, p.id, false);
  if (!r) return gaTill('omgang', { omgangId: o.id, lage: lampligtLage(o, 'tid') }, true);
  if (!utkastTid && r.tid !== null) utkastTid = komma(r.tid);
  sattRubrik(p.namn, o.deltagare.indexOf(p.id) + 1);
  underrubrik.textContent = `Tid · försök ${r.forsok} · ${PROV[o.gren].namn}`;
  hemKnapp.hidden = false;
  // Pilarna står bara här, och den som pekar ut i tomma intet slocknar i
  // stället för att svara med ett meddelande man ändå inte läser i mörker.
  for (const knapp of stegaKnappar) {
    knapp.hidden = false;
    knapp.disabled = !stegadSkytt(o, p.id, Number(knapp.dataset.stega));
  }

  app.innerHTML = `
    <div class="tidvisning ${utkastTid ? '' : 'tom'}"
      >${esc(visadTid(utkastTid) || '0,00')}<span class="enhet"> s</span></div>
    <p class="dampad liten" style="text-align:center">Tiden mäts mellan startsignal och sista skott.<br>
    Knappa siffrorna rakt av — <b>555</b> blir 5,55 och <b>6667</b> blir 66,67. Komma går också bra.</p>
    <div class="knappsats">
      ${[1, 2, 3, 4, 5, 6, 7, 8, 9].map((n) => `<button data-siffra="${n}">${n}</button>`).join('')}
      <button data-siffra=",">,</button>
      <button data-siffra="0">0</button>
      <button data-radera="1">⌫</button>
    </div>`;
  // Vad knappen leder till ska stå på den, och VEM den leder till under den.
  // I mörker vill man inte gissa om nästa tryck ger nästa skytt eller poängen.
  const nasta = nastaEfterTid(o, p.id);
  const text = !nasta ? 'Spara &amp; tillbaka'
    : nasta.typ === 'tid' ? 'Spara &amp; nästa skytt' : 'Spara &amp; börja med poängen';
  bottenrad.innerHTML = `
    <button class="knapp primar" data-spara-tid="nasta">${text}</button>
    ${nasta ? `<p class="nastaskytt">Nästa: <b>${esc(skyttEtikett(o, nasta.id))}</b>`
      + `${nasta.typ === 'poang' ? ' — poäng' : ''}</p>` : ''}
    <div class="knapprad">
      <button class="knapp liten" data-spara-tid="lista">Spara &amp; tillbaka</button>
      <button class="knapp liten" data-till-poang="1">Poäng för ${esc(tilltalsnamn(p.namn))}</button>
    </div>`;
}

function sparaTid() {
  const o = lager.omgang(vy.omgangId);
  const r = lager.pagaende(o.id, vy.personId);
  const tal = tolkadTid(utkastTid);
  if (utkastTid && (tal === null || tal <= 0)) {
    flash(tal === 0 ? 'Tiden måste vara större än noll.' : 'Tiden ser inte ut som ett tal.');
    return false;
  }
  lager.andraResultat(r.id, { tid: tal });
  return true;
}

// ---------------------------------------------------------------- poängen

function ritaPoang() {
  const o = lager.omgang(vy.omgangId);
  const p = lager.person(vy.personId);
  if (!o || !p) return gaTill('start');
  const prov = PROV[o.gren];
  const r = lager.pagaende(o.id, p.id, false);
  if (!r) return gaTill('omgang', { omgangId: o.id, lage: lampligtLage(o, 'poang') }, true);
  sattRubrik(p.namn, o.deltagare.indexOf(p.id) + 1);
  underrubrik.textContent = `Poäng · försök ${r.forsok} · ${prov.namn}`;
  hemKnapp.hidden = false;

  const grupper = prov.grupper.map((g) => `
    <div class="zongrupp" data-grupp="${g.id}">
      <h3><span>${esc(g.namn)}</span><span class="raknare"></span></h3>
      <p class="gruppvarning" hidden></p>
      <div class="zoner">
        ${g.zoner.map((z) => `
          <button class="zonknapp" data-zon="${z}" data-poang="${ZONPOANG[z]}">
            <span class="bokstav">${z}</span>
            <span class="antal">${r.traffar[z] || 0}</span>
            <span class="poang">${(r.traffar[z] || 0) * ZONPOANG[z]} p</span>
          </button>`).join('')}
      </div>
    </div>`).join('');

  app.innerHTML = `
    ${r.tid === null ? '<div class="varningsruta">Ingen tid inlagd ännu — utan tid går ingen poängkvot att räkna.</div>' : ''}
    <p class="dampad liten">Tryck en gång per träff — bättringsskotten med.
    Appen räknar de bästa. Håll in en knapp för att nolla den.</p>
    ${grupper}
    <div class="summering">
      <span>Tid <b>${r.tid === null ? '–' : komma(r.tid) + ' s'}</b> · <span id="poangsumma">0 p</span></span>
      <span><span class="pk" id="pkvarde">–</span> <span class="utfall" id="utfall"></span></span>
    </div>
    <p class="brister" id="brister"></p>
    <label class="falt" style="display:flex;align-items:center;gap:0.6rem">
      <input type="checkbox" id="vapen" style="width:26px;height:26px;margin:0"
             ${r.vapenhanteringUnderkand ? 'checked' : ''}>
      <span>Underkänd — osäker eller felaktig vapenhantering</span>
    </label>`;
  // Som i tidvyn: knappen säger vad som händer, raden under vem det gäller.
  const nastaPoang = nastaAnnan(o, 'poang', p.id);
  bottenrad.innerHTML = `
    <button class="knapp primar" data-registrera="1">
