/** Räknar om summering, kvot och brister utan att rita om knapparna — det ska
 *  gå att knappa fort utan att skärmen hoppar. */
function uppdateraPoang() {
  const o = lager.omgang(vy.omgangId);
  const r = lager.pagaende(o.id, vy.personId);
  const b = bedom(o.gren, r.traffar, r.tid, r.vapenhanteringUnderkand);

  // Räknaren säger tre olika saker: hur långt det är kvar, att målytan är
  // klar, och — när bättringsskotten knappats in — att appen väljer ut de
  // bästa. Siffrorna kommer ur bedom() ovan, som redan gjort urvalet.
  for (const g of b.grupper) {
    const ruta = app.querySelector(`[data-grupp="${g.id}"]`);
    const klar = g.antal >= g.kravAntal;
    const del = ruta.querySelector('.raknare');
    if (g.over > 0) {
      // Fler träffar inknappade än målytan räknar: siffrorna inom parentes och
      // i rött. Parentesen säger att talet inte är det protokollet bygger på,
      // och färgen fångar ögat utan att texten behöver läsas — texten bredvid
      // säger sedan vad som gäller.
      del.innerHTML = `<span class="over">(${g.antal} av ${g.kravAntal})</span>`
        + ` — de ${g.kravAntal} bästa räknas`;
    } else {
      del.textContent = `${g.antal} av ${g.kravAntal}${klar ? ' — klart' : ''}`;
    }
    del.classList.toggle('klar', klar && g.over === 0);
    // Dubbla antalet räknande träffar är ingen regelgräns utan ett rimlighets-
    // mått: så många bättringsskott skjuter ingen, så då är det troligen ett
    // tryck för mycket. Appen spärrar inte — den påpekar.
    const varning = ruta.querySelector('.gruppvarning');
    varning.hidden = g.over <= g.kravAntal;
    varning.textContent = varning.hidden ? ''
      : `${g.antal} träff inlagda — kontrollera att inget tryck blivit fel.`;
  }
  app.querySelector('#poangsumma').textContent = `${b.poang} p`;
  // Ingen bedömning innan det finns något att bedöma: en tom serie med tid
  // inlagd skulle annars mötas av ett rött "Underkänd" redan innan första
  // träffen knappats in.
  const nagotInmatat = b.poang > 0 || r.vapenhanteringUnderkand;
  const visa = b.pk !== null && nagotInmatat;
  const pk = app.querySelector('#pkvarde');
  pk.textContent = visa ? komma(b.pk) : '–';
  pk.className = 'pk ' + (visa ? (b.godkand ? 'g' : 'u') : '');
  // Utfallet i klartext bredvid kvoten — grönt godkänt, rött underkänt. Färg
  // ensam duger inte som besked, och siffran säger inget om träffkraven eller
  // vapenhanteringen.
  const utfall = app.querySelector('#utfall');
  utfall.textContent = visa ? (b.godkand ? 'Godkänd' : 'Underkänd') : '';
  utfall.className = 'utfall ' + (visa ? (b.godkand ? 'g' : 'u') : '');
  app.querySelector('#brister').textContent = (b.godkand || !nagotInmatat) ? '' : b.brister.join(' · ');
}

function sattZon(knapp, antal) {
  const o = lager.omgang(vy.omgangId);
  const r = lager.pagaende(o.id, vy.personId);
  const zon = knapp.dataset.zon;
  const traffar = { ...r.traffar };
  if (antal > 0) traffar[zon] = antal; else delete traffar[zon];
  lager.andraResultat(r.id, { traffar });
  knapp.querySelector('.antal').textContent = antal;
  knapp.querySelector('.poang').textContent = antal * Number(knapp.dataset.poang) + ' p';
  knapp.classList.toggle('har', antal > 0);
  uppdateraPoang();
}

/** Ritar om granskningen och huvudknappen — men inte fältet man skriver i,
 *  som skulle tappa både markör och tangentbord av en omritning. */
function uppdateraImportgranskning() {
  const falt = app.querySelector('#importtext');
  if (!falt) return;
  vy.text = falt.value;
  const g = falt.value.trim() ? lager.granskaSkyttelista(falt.value) : null;
  const rad = (p) => `<div class="forsokrad">
    <span>${esc(p.namn)}</span>
    <span class="dampad">${esc([p.forband, p.fmid].filter(Boolean).join(' · '))}</span>
  </div>`;
  // Meningarna byggs hela i stället för att radbrytas i markupen: en
  // radbrytning mitt i "2 rader hoppas över" syns inte på skärmen, men gör
  // texten svår att både läsa i källan och söka efter i ett prov.
  const rader = (n) => `${n} ${n === 1 ? 'rad' : 'rader'}`;
  const delar = [];
  delar.push('<h2>Det här läggs till</h2>');
  delar.push(g && g.nya.length
    ? `<div class="historik">${g.nya.map(rad).join('')}</div>`
    : '<p class="dampad liten">Ingenting — allt i listan finns redan,'
      + ' eller gick inte att tolka.</p>');
  if (g && g.dubbletter.length) {
    const namn = esc(g.dubbletter.map((p) => p.namn).join(', '));
    // Inifrån en omgång är en dubblett inget som hoppas över: skytten finns
    // redan i registret, men ska självklart ändå stå på linjen.
    delar.push(vy.retur
      ? `<p class="dampad liten">${rader(g.dubbletter.length)} står redan i registret`
        + ` och bockas bara i: ${namn}.</p>`
      : `<p class="dampad liten"><b>${rader(g.dubbletter.length)} hoppas över</b>,`
        + ` för att skytten redan står i registret: ${namn}.</p>`);
  }
  if (g && g.ogiltiga.length) {
    delar.push(`<div class="varningsruta"><b>${rader(g.ogiltiga.length)} utan namn</b>`
      + ` läses inte in: ${esc(g.ogiltiga.map((r) => `rad ${r.rad}`).join(', '))}.</div>`);
  }
  app.querySelector('#granskning').innerHTML = g ? delar.join('') : '';

  // Inifrån en omgång räknas även dubbletterna: de ska bockas i även om de
  // inte skapas. Från registret finns det däremot inget att göra åt dem, och
  // en lista som bara innehåller kända namn ska ge en död knapp.
  const antal = !g ? 0 : g.nya.length + (vy.retur ? g.dubbletter.length : 0);
  const knapp = bottenrad.querySelector('[data-import="kor"]');
  knapp.disabled = !antal;
  const ord = `${antal} ${antal === 1 ? 'skytt' : 'skyttar'}`;
  knapp.textContent = !antal ? 'Lägg till skyttarna'
    : (vy.retur ? `Lägg till ${ord} i omgången` : `Lägg till ${ord}`);
}

/**
 * Rutan för en ny skytt. Var först en kedja av prompt(): en fråga i taget, och
 * ingen möjlighet att visa att två av tre fält får lämnas tomma. Nu står alla
 * framme på en gång, med grått "valfritt" i de frivilliga.
 *
 * Löftet löses ut av Spara eller Avbryt, så att de tre ställen som lägger upp
 * en skytt — registret, ny omgång och mitt i en pågående — kan invänta svaret
 * på samma sätt som de inväntade prompten.
 */
function nySkytt() {
  return new Promise((klar) => {
    const ruta = document.createElement('div');
    ruta.className = 'modal';
    ruta.innerHTML = `<form class="kort modalkort" novalidate>
      <h2>Ny skytt</h2>
      <label class="falt">Namn
        <input id="nyttNamn" autocomplete="off" autocapitalize="words"></label>
      <label class="falt">Förband
        <input id="nyttForband" autocomplete="off" placeholder="valfritt"></label>
      <label class="falt">Fmid/Anstnr
        <input id="nyttFmid" autocomplete="off" placeholder="valfritt"></label>
      <div class="knapprad">
        <button type="button" class="knapp liten" data-avbryt="1">Avbryt</button>
        <button type="submit" class="knapp liten primar">Spara</button>
      </div>
    </form>`;
    document.body.appendChild(ruta);
    const namnfalt = ruta.querySelector('#nyttNamn');
    namnfalt.focus();

    const stang = (p) => { ruta.remove(); klar(p); };
    ruta.querySelector('[data-avbryt]').addEventListener('click', () => stang(null));
    ruta.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') stang(null); });
    // Ett tryck utanför kortet stänger, men bara om det började där — annars
    // ryker rutan när ett markeringsdrag i ett fält råkar sluta utanför.
    ruta.addEventListener('pointerdown', (ev) => {
      if (ev.target === ruta) ruta.dataset.utanfor = '1';
    });
    ruta.addEventListener('click', (ev) => {
      if (ev.target === ruta && ruta.dataset.utanfor) stang(null);
    });
    ruta.querySelector('form').addEventListener('submit', (ev) => {
      ev.preventDefault();
      const namn = namnfalt.value.trim();
      if (!namn) {
        // Utan namn finns ingen skytt att spara. Fältet får säga ifrån där
        // ögat redan är i stället för att en ruta till läggs ovanpå.
        namnfalt.classList.add('saknas');
        namnfalt.focus();
        return;
      }
      const p = lager.laggTillPerson(namn,
        ruta.querySelector('#nyttForband').value, ruta.querySelector('#nyttFmid').value);
      flash(`${p.namn} tillagd.`);
      stang(p);
    });
  });
}

// -------------------------------------------------------------------- hjälp
//
// Texten bor i src/hjalp.md och bakas in i sidan av bygg.py. Renderaren nedan
// klarar det markdown-filen använder och inget mer: rubriker, stycken,
// punktlistor, fet stil och länkar. Att dra in ett markdown-bibliotek för
// fyra avsnitt vore att bryta löftet om en app utan beroenden.

function markdown(text) {
  // Ordningen är inte godtycklig: **fet** måste konsumeras före *kursiv*,
  // annars äter kursiven det första asteriskparet.
  const inline = (rad) => esc(rad)
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/\*([^*]+)\*/g, '<i>$1</i>')
    // Bara http(s) blir länk. Texterna är våra egna och byggs in vid bygget,
    // så det här är inget öppet inflöde — men `[klick](javascript:…)` hade
    // blivit en körbar länk, och den möjligheten finns ingen anledning att
    // lämna kvar. Annat schema återges som text.
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (helaTraffen, text, url) =>
      (/^https?:\/\//i.test(url)
        ? `<a href="${url}" target="_blank" rel="noopener noreferrer">${text}</a>`
        : helaTraffen));

  return text.trim().split(/\n\s*\n/).map((block) => {
    const rader = block.split('\n').map((r) => r.trim()).filter(Boolean);
    if (rader[0].startsWith('## ')) return `<h2>${inline(rader[0].slice(3))}</h2>`;
    if (rader.every((r) => r.startsWith('- '))) {
      return `<ul class="punkter">${rader.map((r) =>
        `<li>${inline(r.slice(2))}</li>`).join('')}</ul>`;
    }
    return `<p>${inline(rader.join(' '))}</p>`;
  }).join('');
}

      <button class="knapp liten" data-dok="hjalp">Om appen</button>
      <!-- Koden är öppen, och det är en del av löftet: den som undrar vad
           appen gör med uppgifterna ska kunna gå och läsa efter. Ny flik, och
           noreferrer utöver noopener — trycker någon på länken ska GitHub inte
           få veta varifrån den trycktes. -->

         target="_blank" rel="noopener noreferrer">Koden på GitHub</a>

    <h2>Nollställ</h2>

    <p class="dampad liten" style="margin-top:2rem">
      Version ${esc(UTGAVA)}.
      Poängzoner enligt Helfigur 2020: A 5, B 4, C 3, D 3, X 2, H 1.
      Krav enligt respektive delmoment — pistol PK 2,0, automatkarbin PK 1,0 på

    <input type="file" id="kopiafil" accept="application/json,.json" hidden>`;

}

// ---------------------------------------------------------------- exporten

async function exportera(format) {
  const o = lager.omgang(vy.omgangId);
  const u = underlag(o, lager.las().personer, lager.resultat(o.id));
  const text = somText(u);
  if (format === 'txt') return dela(`${u.filnamn}.txt`, text, 'txt', text);
  if (format === 'csv') return dela(`${u.filnamn}.csv`, somCsv(u), 'csv', text);
  if (format === 'xlsx') return dela(`${u.filnamn}.xlsx`, somXlsx(u), 'xlsx', text);
  if (format === 'pdf') return dela(`${u.filnamn}.pdf`, somPdf(u), 'pdf', text);
}

function ritaExportval() {
  const o = lager.omgang(vy.omgangId);
  const u = underlag(o, lager.las().personer, lager.resultat(o.id));
  sattRubrik('Dela resultatet');
  underrubrik.textContent = `${u.godkanda} av ${u.antalSkyttar} godkända`;
  hemKnapp.hidden = false;
  app.innerHTML = `
    <p class="dampad liten">Delningsrutan öppnar Mail, Meddelanden eller det du väljer.
    Kan telefonen inte dela filer laddas de ned i stället.</p>
    <div class="knapprad"><button class="knapp" data-format="txt">Text i mailet</button></div>
    <div class="knapprad"><button class="knapp" data-format="pdf">PDF</button></div>
    <div class="knapprad"><button class="knapp" data-format="xlsx">Excel (xlsx)</button></div>
    <div class="knapprad"><button class="knapp" data-format="csv">CSV</button></div>
    <h2>Förhandsgranskning</h2>
    <div class="kort"><pre style="white-space:pre-wrap;margin:0;font-size:0.8rem">${esc(somText(u))}</pre></div>`;
  bottenrad.innerHTML = `
    <div class="knapprad">
      <button class="knapp liten" data-vy="omgang-ater">Tillbaka till listan</button>
      <button class="knapp liten" data-skriv-ut="1">Skriv ut</button>
    </div>`;
}

// -------------------------------------------------------------- rita om allt

function rita() {
  // Meddelandet städas INTE bort här. Nästan varje bekräftelse — "tavla 3",
  // "omgången raderad" — följs omedelbart av en omritning, och en flash som
  // rensades av sin egen omritning hann aldrig synas. Den tar bort sig själv
  // efter sina sekunder, och en ny ersätter alltid den gamla.
  // Pilarna hör till tidfönstret; varje annan vy ska slippa dem utan att
  // behöva veta om att de finns.
  for (const knapp of stegaKnappar) knapp.hidden = true;
  if (vy.namn === 'start') ritaStart();
  else if (vy.namn === 'ny') ritaNy();
  else if (vy.namn === 'omgang') ritaOmgang();
  else if (vy.namn === 'tid') ritaTid();
  else if (vy.namn === 'poang') ritaPoang();
  else if (vy.namn === 'register') ritaRegister();
  else if (vy.namn === 'import') ritaImport();
  else if (vy.namn === 'installningar') ritaInstallningar();
  else if (vy.namn === 'export') ritaExportval();
  else if (vy.namn === 'anvisning') ritaAnvisning();
  else if (vy.namn === 'lagg-till') ritaLaggTill();
  else if (vy.namn === 'dok') ritaDokument();
  window.scrollTo(0, 0);
  mätBottenrad();
}

/**
 * Skriver bottenradens höjd till en CSS-variabel, så att sidans nedre
 * marginal alltid räcker. Raden är fast förankrad och olika hög i olika vyer
 * — en fast marginal göms antingen bakom knapparna eller slösar skärm.
 */
function mätBottenrad() {
  const rad = bottenrad.offsetHeight;
  if (rad > 0) document.documentElement.style.setProperty('--bottenradhojd', `${rad}px`);
  // Sidans marginal måste rymma bottenraden OCH beskedet om en ny version,
  // annars göms sista raden innehåll bakom det. Beskedet placeras däremot
  // mot bottenradens egen höjd — läste det totalen skulle det sväva sin egen
  // höjd för högt.
  const h = rad + (uppdateringsrad.hidden ? 0 : uppdateringsrad.offsetHeight);
  if (h > 0) document.documentElement.style.setProperty('--bottenhojd', `${h}px`);
}
window.addEventListener('resize', mätBottenrad);

/**
 * Öppnar en skytt för inmatning.
 *
 * Ett nytt försök skapas BARA för den som aldrig skjutit. Är skytten färdig —
 * registrerad och utan öppet försök — händer ingenting; ett omtag ska tryckas
 * fram med "+ Nytt försök", inte råka uppstå för att man petade på raden.
 */
function oppnaSkytt(omgang, personId, lage) {
  const alla = lager.resultatFor(omgang.id, personId);
  const oppet = alla.find((r) => !r.registrerad);
  if (!oppet && alla.length) {
    return flash(`${lager.person(personId).namn} är klar. `
      + 'Tryck ”+ Nytt försök” på raden för ett omtag.', 4);
  }
  if (!oppet) lager.pagaende(omgang.id, personId);       // första försöket
  return gaTill(lage === 'poang' ? 'poang' : 'tid',
    { omgangId: omgang.id, personId, lage }, vy.namn !== 'omgang');
}

/**
 * Väntar skytten på det här läget?
 *
 * Ett öppet försök utan tid väntar på sin tid; ett med tid väntar på poäng.
 * Har skytten inget öppet försök väntar hen bara om hen aldrig skjutit — en
 * färdig skytt ska varken räknas i lägesväljaren eller dras in i svepet och
 * få ett nytt försök påhittat åt sig. Ett omtag startas med "+ Nytt försök".
 */
function behoverLage(omgang, personId, lage) {
  const alla = lager.resultatFor(omgang.id, personId);
  const oppet = alla.find((r) => !r.registrerad);
  if (lage === 'tid') return oppet ? oppet.tid === null : alla.length === 0;
  return !!oppet && oppet.tid !== null;
}

/**
 * Vilket läge vallistan ska stå i när man kommer tillbaka till den.
 *
 * Regeln är enkel: stå kvar i det läge man kom ifrån så länge det finns något
 * kvar att göra där — alltså så länge dess knapp bär en siffra. Är det läget
 * avklarat byter listan till det andra, som ju är nästa steg. Är allt klart
 * står den kvar där den var.
 */
function lampligtLage(omgang, nuvarande) {
  const kvar = (lage) => omgang.deltagare.some((id) => behoverLage(omgang, id, lage));
  if (nuvarande && kvar(nuvarande)) return nuvarande;
  if (kvar('tid')) return 'tid';
  if (kvar('poang')) return 'poang';
  return nuvarande || 'tid';
}

// ------------------------------------------------------- nästa i ordningen

function nastaSkytt(omgang, lage, efterId = null) {
  const ordning = omgang.deltagare;
  const start = efterId ? ordning.indexOf(efterId) + 1 : 0;
  const behover = (id) => behoverLage(omgang, id, lage);
  // Sök framåt från den nyss avklarade, och varva sedan om från början —
  // instruktören ska aldrig behöva leta själv.
  for (let i = start; i < ordning.length; i++) if (behover(ordning[i])) return ordning[i];
  for (let i = 0; i < start && i < ordning.length; i++) if (behover(ordning[i])) return ordning[i];
  return null;
}

// ------------------------------------------------------------ händelser

document.addEventListener('click', async (ev) => {
  const t = ev.target.closest('[data-vy], [data-oppna], [data-vaxla], [data-ny-skytt], ' +
    '[data-starta], [data-spara-ny], [data-skytt], [data-lage], [data-nasta], [data-siffra], ' +
    '[data-radera], [data-spara-tid], [data-till-poang], [data-till-tid], [data-registrera], ' +
    '[data-export], [data-stega], ' +
    '[data-format], [data-historik], [data-nytt-forsok], [data-soptunna], [data-kopia], ' +
    '[data-radera-allt], [data-radera-alla-skyttar], [data-skriv-ut], [data-anvisning], ' +
    '[data-lagg-till], [data-lagg-in], [data-flyttlage], [data-dok], [data-import], ' +
    '[data-uppdatera], ' +
    '.zonknapp');
  if (!t) return;
  const d = t.dataset;

  // --- navigering ---
  if (d.vy === 'ny') return gaTill('ny', { valda: [] });
  if (d.vy === 'register') return gaTill('register');
  if (d.vy === 'import') return gaTill('import', { text: '' });
  if (d.dok) return gaTill('dok', { dok: d.dok });
  if (d.vy === 'start') return gaTill('start', {}, true);
  if (d.vy === 'anvisning') {
    // Öppnas anvisningen från en omgång ska den visa det prov som skjuts.
    const o = vy.omgangId ? lager.omgang(vy.omgangId) : null;
    return gaTill('anvisning',
      { gren: o ? o.gren : (vy.gren || 'pist'), omgangId: vy.omgangId, lage: vy.lage });
  }
  if (d.anvisning) {
    vy.gren = d.anvisning;      // rör bara vilket prov som visas
    return rita();
  }
  if (d.vy === 'installningar') return gaTill('installningar');
  if (d.vy === 'omgang-ater') {
    // Knappen fanns först bara på poängvyn och hårdkodade 'poang'; sedan den
    // hamnade även under anvisningen och exporten slängde den tillbaka en i
    // poängläget mitt i tidssvepet.
    const o = lager.omgang(vy.omgangId);
    return gaTill('omgang', { omgangId: vy.omgangId, lage: lampligtLage(o, vy.lage) }, true);
  }
  if (d.oppna) {
    if (t.dataset.spärrKlick) { delete t.dataset.spärrKlick; return; }
    return gaTill('omgang', { omgangId: d.oppna, lage: 'tid' });
  }
  // Soptunnan som långtrycket lade fram. Samma knapp för båda listorna —
  // raden talade om vad den var när den lämnade över strängen.
  if (d.soptunna) {
    const [typ, id] = d.soptunna.split(':');
    taBortSoptunnan();
    vibrera(30);
    if (typ === 'omgang') {
      const o = lager.omgang(id);
      if (o) {
        const antal = lager.resultat(o.id).filter((r) => r.registrerad).length;
        if (confirm(`Radera omgången ${PROV[o.gren].namn} ${o.datum}`
          + `${o.plats ? ' på ' + o.plats : ''}?\n\n`
          + `${antal} registrerade försök raderas med den.`)) {
          lager.raderaOmgang(o.id);
          flash('Omgången raderad.');
        }
      }
    }
    if (typ === 'person') {
      const p = lager.person(id);
      if (p && confirm(`Radera ${p.namn} och alla hens resultat?`)) {
        lager.raderaPerson(p.id);
        flash(`${p.namn} raderad.`);
      }
    }
    return rita();
  }

  // --- ny omgång ---
  if (d.vaxla) {
    spegla();
    const valda = new Set(vy.valda || []);
    valda.has(d.vaxla) ? valda.delete(d.vaxla) : valda.add(d.vaxla);
    vy.valda = [...valda];
    return rita();
  }
  if (d.nySkytt) {
    const p = await nySkytt();
    if (!p) return;
    if (vy.namn === 'ny') {
      spegla();
      vy.valda = [...(vy.valda || []), p.id];
    }
    if (vy.namn === 'lagg-till') {
      // Registrerad mitt i en omgång ska hen självklart också hamna på linjen.
      const o = lager.omgang(vy.omgangId);
      lager.andraOmgang(o.id, { deltagare: [...o.deltagare, p.id] });
      flash(`${p.namn} är tavla ${o.deltagare.length}.`);
      return gaTill('omgang', { omgangId: o.id, lage: vy.lage }, true);
    }
    return rita();
  }
  if (d.starta || d.sparaNy) {
    spegla();
    const o = lager.laggTillOmgang({
      gren: vy.gren || 'pist', datum: vy.datum, plats: vy.plats || '',
      instruktor: vy.instruktor || '', deltagare: vy.valda || [],
    });
    if (d.starta) return gaTill('omgang', { omgangId: o.id, lage: 'tid' }, true);
    // Sparad utan att startas: tillbaka till startsidan, där den ligger och
    // väntar. `ersatt` gör att bakåtknappen inte leder in i formuläret igen —
    // omgången är redan skapad och ett andra tryck skulle ge en dubblett.
    flash(`${PROV[o.gren].namn} ${o.datum} är sparad. Öppna den när ni börjar.`, 4);
    return gaTill('start', {}, true);
  }

  // --- vallistan ---
  if (d.lage) {
    vy.lage = d.lage;
    return rita();
  }
  if (d.flyttlage) {
    vy.flyttlage = d.flyttlage === 'pa';
    return rita();
  }
  if (d.skytt) {
    if (t.dataset.spärrKlick) { delete t.dataset.spärrKlick; return; }
    if (vy.flyttlage) return;                     // i flyttläge dras det, inte öppnas
    return oppnaSkytt(lager.omgang(vy.omgangId), d.skytt, vy.lage);
  }
  if (d.historik) {
    vy.oppen = vy.oppen === d.historik ? null : d.historik;
    return rita();
  }
  if (d.laggTill) return gaTill('lagg-till', { omgangId: vy.omgangId, lage: vy.lage });
  if (d.laggIn) {
    const o = lager.omgang(vy.omgangId);
    lager.andraOmgang(o.id, { deltagare: [...o.deltagare, d.laggIn] });
    flash(`${lager.person(d.laggIn).namn} är tavla ${o.deltagare.length}.`);
    return gaTill('omgang', { omgangId: o.id, lage: vy.lage }, true);
  }
  if (d.nyttForsok) {
    lager.pagaende(vy.omgangId, d.nyttForsok);      // skapar nästa försök
    vy.lage = 'tid';
    return gaTill('tid', { omgangId: vy.omgangId, personId: d.nyttForsok, lage: 'tid' });
  }
  if (d.nasta) {
    const o = lager.omgang(vy.omgangId);
    const id = nastaSkytt(o, d.nasta);
    if (!id) {
      // En omgång som lagts upp i förväg står tom tills linjen fylls på, och
      // "alla har en tid" vore obegripligt när ingen finns.
      if (!o.deltagare.length) return flash('Inga deltagare ännu — lägg till skyttar först.');
      return flash(d.nasta === 'tid'
        ? 'Alla har en tid. Byt till POÄNG.'
        : 'Ingen väntar på poäng.');
    }
    return oppnaSkytt(o, id, d.nasta);
  }

  // --- sifferknappsatsen ---
  if (d.siffra) {
    vibrera(12);
    if (d.siffra === ',') {
      if (utkastTid.includes(',')) return;
      // Komma utan siffror framför blir "0," — annars står det bara ett komma.
      utkastTid = (utkastTid || '0') + ',';
      return uppdateraTidvisning();
    }
    // Två decimaler räcker; en skjuttimer visar inte fler.
    if (utkastTid.includes(',') && utkastTid.split(',')[1].length >= 2) return;
    if (utkastTid.replace(',', '').length >= 6) return;
    utkastTid += d.siffra;
    return uppdateraTidvisning();
  }
  if (d.radera) {
    vibrera(12);
    utkastTid = utkastTid.slice(0, -1);
    return uppdateraTidvisning();
  }
  if (d.sparaTid) {
    if (!sparaTid()) return;
    const o = lager.omgang(vy.omgangId);
    if (d.sparaTid === 'nasta') {
      const nasta = nastaEfterTid(o, vy.personId);
      if (nasta && nasta.typ === 'tid') return oppnaSkytt(o, nasta.id, 'tid');
      if (nasta) {
        // Hela linjen har skjutit — nästa steg är poängen, från tavla 1.
        flash('Alla har en tid. Nu poängen, från första tavlan.');
        return oppnaSkytt(o, nasta.id, 'poang');
      }
    }
    return gaTill('omgang', { omgangId: o.id, lage: lampligtLage(o, 'tid') }, true);
  }
  // Pilarna vid namnet: en tavla fram eller tillbaka i skjutordningen. Den
  // påbörjade tiden sparas på vägen, precis som när hemknappen trycks — annars
  // straffas den som stegar tillbaka för att rätta något med att tappa det hen
  // just knappat in.
  if (d.stega) {
    if (!sparaTid()) return;
    const o = lager.omgang(vy.omgangId);
    const id = stegadSkytt(o, vy.personId, Number(d.stega));
    if (!id) return flash('Ingen mer skytt åt det hållet.');
    return oppnaSkytt(o, id, 'tid');
  }
  if (d.tillPoang) {
    if (!sparaTid()) return;
    return gaTill('poang', { omgangId: vy.omgangId, personId: vy.personId, lage: 'poang' }, true);
  }
  if (d.tillTid) {
    return gaTill('tid', { omgangId: vy.omgangId, personId: vy.personId, lage: 'tid' }, true);
  }

  // --- zonknappar ---
  if (t.classList.contains('zonknapp')) {
    if (t.dataset.hollsIn === '1') { delete t.dataset.hollsIn; return; }
    // Varje hål i tavlan knappas in, bättringsskotten med. Målytan har inget
    // tak: urvalet av de räknande träffarna görs av bedom(), inte av handen
    // som knappar. Ett feltryck rättas med ett långt tryck som nollar zonen.
    vibrera(15);
    const nu = Number(t.querySelector('.antal').textContent) || 0;
    return sattZon(t, nu + 1);
  }

  // --- registrera försöket ---
  if (d.registrera) {
    const o = lager.omgang(vy.omgangId);
    const r = lager.pagaende(o.id, vy.personId);
    if (r.tid === null && !r.vapenhanteringUnderkand) {
      return flash('Lägg in tiden först — utan den finns ingen poängkvot.');
    }
    lager.registrera(r.id);
    vibrera(30);
    const b = bedom(o.gren, r.traffar, r.tid, r.vapenhanteringUnderkand);
    const utfall = `${lager.person(vy.personId).namn}: ${b.godkand ? 'GODKÄND' : 'UNDERKÄND'}`
      + (b.pk === null ? '' : ` · PK ${komma(b.pk)}`);
    const id = nastaAnnan(o, 'poang', vy.personId);
    if (id) {
      flash(utfall);
      return oppnaSkytt(o, id, 'poang');
    }
    // Sista skytten: säg hur det gick för hela laget, det är ändå frågan man
    // ställer sig i det ögonblicket.
    const u = underlag(o, lager.las().personer, lager.resultat(o.id));
    flash(`${utfall}. Omgången klar — ${u.godkanda} av ${u.antalSkyttar} godkända.`, 5);
    return gaTill('omgang', { omgangId: o.id, lage: lampligtLage(o, 'poang') }, true);
  }

  // --- export ---
  if (d.export) return gaTill('export', { omgangId: vy.omgangId, lage: vy.lage });
  if (d.format) {
    try {
      const utfall = await exportera(d.format);
      if (utfall === 'nedladdad') flash('Filen laddades ned.');
    } catch (fel) {
      flash('Det gick inte att skapa filen: ' + fel.message, 5);
    }
    return;
  }
  if (d.skrivUt) return window.print();
  if (d.uppdatera) return location.reload();

  // --- register och inställningar ---
  if (d.raderaAllaSkyttar) {
    const antal = lager.personer().length;
    if (confirm(`${antal === 1 ? 'Radera skytten och hens resultat?'
      : `Radera alla ${antal} skyttar och deras resultat?`}\n\n`
      + 'Omgångarna finns kvar, men blir tomma.')) {
      for (const p of lager.personer()) lager.raderaPerson(p.id);
      flash(`${antalOrd(antal, 'skytt raderad', 'skyttar raderade')}.`);
      rita();
    }
    return;
  }
  if (d.kopia === 'ut') {
    const namn = `kompetensprov-kopia-${new Date().toISOString().slice(0, 10)}.json`;
    await dela(namn, lager.sakerhetskopia(), 'txt', 'Säkerhetskopia från FM kompetensprov');
    return;
  }
  if (d.kopia === 'in') return app.querySelector('#kopiafil').click();
  if (d.import === 'oppna') {
    // Öppnad från en halvt ifylld omgång: hela vyn följer med som `retur` och
    // läggs tillbaka som den var, plus de skyttar listan pekade ut.
    spegla();
    return gaTill('import', { text: '', retur: { ...vy } });
  }
  if (d.import === 'ater') {
    return vy.retur ? gaTill('ny', { ...vy.retur }, true) : gaTill('register', {}, true);
  }
  if (d.import === 'fil') return app.querySelector('#importfil').click();
  if (d.import === 'rensa') {
    app.querySelector('#importtext').value = '';
    return uppdateraImportgranskning();
  }
  if (d.import === 'kor') {
    // Läses om ur fältet i stället för att lita på det som ritades: texten kan
    // ha ändrats efter sista granskningen, och det som läggs in ska vara det
    // som står i rutan — inte det som råkade stå där när knappen fick sin text.
    const g = lager.importeraSkyttar(app.querySelector('#importtext').value);
    if (!vy.retur) {
      if (!g.nya.length) return flash('Ingen ny skytt att lägga till.');
      flash(`${g.nya.length} ${g.nya.length === 1 ? 'skytt tillagd' : 'skyttar tillagda'}.`
        + (g.dubbletter.length ? ` ${g.dubbletter.length} fanns redan.` : ''), 4);
      return gaTill('register', {}, true);
    }
    // Tillbaka till omgången med skyttarna ibockade i listans ordning. Den som
    // redan stod på linjen behåller sin tavla — ordningen är ju tavelnumret,
    // och ett omtag av importen får inte flytta någon som redan fått sitt.
    const retur = { ...vy.retur };
    const valda = [...(retur.valda || [])];
    for (const id of g.idn) if (!valda.includes(id)) valda.push(id);
    retur.valda = valda;
    if (!g.idn.length) return flash('Ingen skytt i listan att bocka i.');
    flash(`${g.idn.length} ${g.idn.length === 1 ? 'skytt' : 'skyttar'} ibockade.`
      + (g.nya.length ? ` ${g.nya.length} är nya i registret.` : ''), 4);
    return gaTill('ny', retur, true);
  }
  if (d.raderaAllt) {
    const svar = prompt('Det här raderar alla skyttar, omgångar och resultat.\n' +
      'Skriv RADERA för att bekräfta:');
    if (svar === 'RADERA') {
      lager.raderaAllt();
      flash('Allt innehåll raderat.');
      return gaTill('start');
    }
    if (svar !== null) flash('Ingenting raderades.');
    return;
  }
});

// Håll in en rad för att radera den — omgångarna på startsidan, skyttarna i
// registret. Gesten var först ett svep vänster, men ett svep syns inte förrän
// man råkar hitta det, och på en lista som också skrollar tolkades halva
// försöken som skrollning. Långtrycket lägger i stället fram en soptunna i
// raden — ett mål att sikta på och trycka, samma gest som redan slår på
// flyttläget i vallistan. Raden får inte öppnas av släppet, därför spärras
// nästa klick.
//
// Raden säger själv vad den raderar med `data-hall-radera="typ:id"`, och
// soptunnan bär samma sträng vidare. Två attribut, inte ett: ett tryck mitt i
// raden ska öppna eller ingenting göra — bara soptunnan raderar.
let hallRad = null;
let raderbarRad = null;

/** Tar bort soptunnan igen — ångrat, eller raden är omritad under fötterna. */
function taBortSoptunnan() {
  if (raderbarRad) {
    raderbarRad.classList.remove('raderbar');
    const knapp = raderbarRad.querySelector('.soptunna');
    if (knapp) knapp.remove();
  }
  raderbarRad = null;
}

document.addEventListener('pointerdown', (ev) => {
  if (ev.target.closest('.soptunna')) return;    // trycket gäller soptunnan
  const rad = ev.target.closest('[data-hall-radera]');
  if (!rad) return;
  hallRad = { rad, y: ev.clientY, timer: setTimeout(() => {
    hallRad = null;                              // gesten är slut; nu syns knappen
    rad.dataset.spärrKlick = '1';
    taBortSoptunnan();
    slappMarkering();
    rad.classList.add('raderbar');
    rad.insertAdjacentHTML('beforeend',
      `<span class="soptunna" data-soptunna="${rad.dataset.hallRadera}"`
      + ' role="button" aria-label="Radera">🗑</span>');
    raderbarRad = rad;
    vibrera(40);
  }, 500) };
});
document.addEventListener('pointermove', (ev) => {
  if (!hallRad) return;
  // Rör sig fingret innan tiden gått ut skrollar man i listan.
  if (Math.abs(ev.clientY - hallRad.y) > 10) {
    clearTimeout(hallRad.timer);
    hallRad = null;
  }
});
for (const h of ['pointerup', 'pointercancel']) {
  document.addEventListener(h, () => {
    if (!hallRad) return;
    clearTimeout(hallRad.timer);
    hallRad = null;
  });
}

// Ett tryck någon annanstans ångrar. Soptunnan själv går förbi, annars vore
// den borta innan klicket hann räknas.
document.addEventListener('click', (ev) => {
  if (!raderbarRad || ev.target.closest('.soptunna')) return;
  taBortSoptunnan();
});

// ---------------------------------------------- flytta en skytt i ordningen
//
// Håll in en rad i vallistan för att lyfta skytten och dra hen till en annan
// plats. Numret sitter på PLATSEN, inte på personen: den som hamnar på tredje
// raden får nummer 3, för det är tavlan hen ska skjuta mot. Därför numreras
// raderna om medan draget pågår.

let drag = null;

function renumrera() {
  app.querySelectorAll('.skyttrad[data-skytt] .nr').forEach((el, i) => {
    el.textContent = `${i + 1}.`;
  });
}

function malIndex(y) {
  const rader = [...app.querySelectorAll('.skyttrad[data-skytt]')];
  for (let i = 0; i < rader.length; i++) {
    const r = rader[i].getBoundingClientRect();
    if (y < r.top + r.height / 2) return i;
  }
  return rader.length - 1;
}

document.addEventListener('pointerdown', (ev) => {
  // I flyttläge dras det i handtaget, och draget börjar direkt — man har redan
  // sagt vad man vill göra. Utanför flyttläget slår ett långt tryck på raden
  // bara PÅ läget; att hålla in och dra i samma rörelse var för hal en gest.
  const handtag = ev.target.closest('[data-dra]');
  if (handtag) {
    const rad = handtag.closest('.skyttrad');
    drag = { rad, y: ev.clientY, aktiv: true, timer: null };
    rad.classList.add('lyft');
    slappMarkering();
    vibrera(20);
    return;
  }
  const rad = ev.target.closest('.skyttrad[data-skytt]');
  if (!rad || vy.flyttlage) return;
  drag = { rad, y: ev.clientY, aktiv: false, timer: setTimeout(() => {
    drag = null;                       // gesten är slut; nu är det läget som gäller
    rad.dataset.spärrKlick = '1';
    slappMarkering();
    vibrera(40);
    vy.flyttlage = true;
    rita();
    flash('Dra i ☰ för att flytta en skytt till en annan tavla.', 4);
  }, 500) };
});

/** Släpper en textmarkering som hunnit uppstå innan CSS-regeln bet. */
function slappMarkering() {
  const markering = window.getSelection && window.getSelection();
  if (markering && markering.removeAllRanges) markering.removeAllRanges();
}

document.addEventListener('pointermove', (ev) => {
  if (!drag) return;
  if (!drag.aktiv) {
    // Rör sig fingret innan tiden gått ut är det en skrollning, inte ett drag.
    if (Math.abs(ev.clientY - drag.y) > 10) {
      clearTimeout(drag.timer);
      drag = null;
    }
    return;
  }
  ev.preventDefault();
  const rader = [...app.querySelectorAll('.skyttrad[data-skytt]')];
  const nu = rader.indexOf(drag.rad);
  const mal = malIndex(ev.clientY);
  if (mal !== nu && mal >= 0) {
    const referens = rader[mal];
    referens.parentNode.insertBefore(drag.rad, mal < nu ? referens : referens.nextSibling);
    renumrera();
    vibrera(10);
  }
});

document.addEventListener('pointerup', () => {
  if (!drag) return;
  clearTimeout(drag.timer);
  const { rad, aktiv } = drag;
  drag = null;
  rad.classList.remove('lyft');
  if (!aktiv) return;
  rad.dataset.spärrKlick = '1';         // släppet ska inte öppna skytten
  const ordning = [...app.querySelectorAll('.skyttrad[data-skytt]')]
    .map((el) => el.dataset.skytt);
  lager.andraOmgang(vy.omgangId, { deltagare: ordning });
  const namn = lager.person(rad.dataset.skytt).namn;
  flash(`${namn} är tavla ${ordning.indexOf(rad.dataset.skytt) + 1}.`);
  rita();
});

// Håll in en zonknapp för att nolla den — enda vägen tillbaka efter en
// feltryckning med handskar på.
let hallTimer = null;
document.addEventListener('pointerdown', (ev) => {
  const knapp = ev.target.closest('.zonknapp');
  if (!knapp) return;
  hallTimer = setTimeout(() => {
    knapp.dataset.hollsIn = '1';
    vibrera(40);
    sattZon(knapp, 0);
  }, 500);
});
for (const h of ['pointerup', 'pointercancel', 'pointerleave']) {
  document.addEventListener(h, () => clearTimeout(hallTimer));
}

// Granskningen följer fältet medan man klistrar in och rättar. Den är billig
// att räkna om — ett skjutlag är tiotals rader, inte tusentals.
document.addEventListener('input', (ev) => {
  if (ev.target.id === 'importtext') uppdateraImportgranskning();
});

document.addEventListener('change', (ev) => {
  if (ev.target.id === 'importfil' && ev.target.files[0]) {
    const lasare = new FileReader();
    lasare.onload = () => {
      app.querySelector('#importtext').value = lasare.result;
      uppdateraImportgranskning();
    };
    // Filen läses som text i telefonen och laddas inte upp någonstans — den
    // går aldrig utanför den här funktionen.
    lasare.readAsText(ev.target.files[0]);
    // Nollställs, annars ger samma fil vald två gånger i rad ingen händelse.
    ev.target.value = '';
  }
  if (ev.target.id === 'vapen') {
    const o = lager.omgang(vy.omgangId);
    const r = lager.pagaende(o.id, vy.personId);
    lager.andraResultat(r.id, { vapenhanteringUnderkand: ev.target.checked });
    uppdateraPoang();
  }
  if (ev.target.id === 'kopiafil' && ev.target.files[0]) {
    const fil = ev.target.files[0];
    const lasare = new FileReader();
    lasare.onload = () => {
      try {
        const n = lager.lasInSakerhetskopia(lasare.result);
        flash(`Inläst: ${antalOrd(n.personer, 'skytt', 'skyttar')}, `
          + `${antalOrd(n.omgangar, 'omgång', 'omgångar')}, ${n.resultat} försök.`, 4);
        rita();
      } catch (fel) {
        flash('Filen gick inte att läsa: ' + fel.message, 5);
      }
    };
    lasare.readAsText(fil);
  }
});

// Hemknappen går alltid till startsidan — ett tryck, ingen gissning om var i
// historiken man befinner sig. Vägen tillbaka till vallistan finns i stället
// som en egen knapp i nederkant på varje vy som ligger inuti en omgång.
hemKnapp.addEventListener('click', () => {
  // En påbörjad tid sparas på vägen ut; annars försvinner det man knappat in
  // bara för att man tryckte fel knapp.
  if (vy.namn === 'tid') sparaTid();
  gaTill('start', {}, true);
});

// Servicearbetaren finns bara i den installerade versionen; som lös fil
// saknas den, och då ska appen starta ändå.
//
// Den nya versionen tar över direkt (skipWaiting), men SIDAN som redan är
// laddad är den gamla appen — hela appen ligger i den ena filen. Utan
// besked syntes en publicering därför först vid nästa start. Nu säger
// arbetaren till, och raden i nederkant låter användaren välja ögonblicket.
//
// Ingen extra begäran görs för det här: webbläsaren letar efter en ny sw.js
// när appen startar, och det som händer nedan är att appen lyssnar på svaret.
// Att fråga oftare — vid varje start eller varje gång appen tas fram — hade
// kostat en utgående förbindelse per gång, och det är precis vad servicearbetaren
// är cache-först för att slippa.
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  // Fanns det redan en arbetare när sidan laddades? Utan den frågan hade
  // raden dykt upp vid den allra första installationen, då ingenting är nytt.
  const styrdFranStart = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').then((reg) => {
    if (reg.waiting) visaUppdatering();
    reg.addEventListener('updatefound', () => {
      const ny = reg.installing;
      if (!ny) return;
      // "installed" = de nya filerna ligger i cachen och är redo. Aktiveringen
      // följer av sig själv, eftersom install-steget kallar skipWaiting().
      ny.addEventListener('statechange', () => {
        if (ny.state === 'installed') visaUppdatering();
      });
    });
  }).catch(() => {});

  function visaUppdatering() {
    if (!styrdFranStart || !uppdateringsrad.hidden) return;
    uppdateringsrad.hidden = false;
    mätBottenrad();
  }
}

history.replaceState(vy, '');
rita();

</script>
